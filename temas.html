, {"t": "Generación de audio con IA", "b": "La síntesis de voz y música mediante IA permite crear contenido de audio personalizado sin necesidad de equipos de grabación profesional."}, {"t": "Reconocimiento de voz", "b": "Los sistemas de reconocimiento de voz convierten audio hablado en texto, siendo la base de asistentes virtuales y transcripción automática."}, {"t": "Visión artificial", "b": "La visión artificial permite que un sistema interprete imágenes o vídeo, identificando objetos, personas o situaciones sin intervención humana directa."}, {"t": "Agentes de IA", "b": "Los agentes de inteligencia artificial ejecutan tareas de varios pasos de forma autónoma, tomando decisiones intermedias sin supervisión constante en cada acción."}, {"t": "Prompts", "b": "Redactar instrucciones claras y específicas para un modelo de IA mejora significativamente la calidad de sus respuestas, siendo una habilidad práctica en sí misma."}, {"t": "Razonamiento en IA", "b": "Los modelos de IA más recientes incorporan pasos intermedios de razonamiento antes de responder, mejorando su desempeño en tareas complejas de varios pasos."}, {"t": "Automatización con IA", "b": "Combinar inteligencia artificial con automatización tradicional permite que los sistemas no solo ejecuten tareas fijas, sino que también tomen decisiones adaptadas al contexto."}, {"t": "Ética de la IA", "b": "El uso responsable de la inteligencia artificial exige considerar sesgos, privacidad y el impacto social de sus decisiones automatizadas."}, {"t": "Automatización de negocios con IA", "b": "Aplicar IA a procesos de negocio, como clasificación de correos o análisis de datos, reduce tiempo operativo en tareas que antes requerían revisión manual."}, {"t": "Atención automática al cliente con IA", "b": "Los sistemas de atención basados en IA pueden resolver consultas frecuentes de forma inmediata, escalando los casos complejos a personas reales."}, {"t": "Generación de contenido con IA", "b": "La IA generativa acelera la producción de borradores de contenido, aunque la revisión y el criterio humano siguen siendo necesarios para asegurar calidad y precisión."}, {"t": "Automatización de marketing con IA", "b": "La IA puede personalizar mensajes y optimizar campañas en tiempo real según el comportamiento de cada usuario, mejorando la eficiencia frente a campañas genéricas."}, {"t": "Automatización de ventas con IA", "b": "Herramientas de IA pueden calificar leads automáticamente según su probabilidad de compra, priorizando el esfuerzo del equipo de ventas hacia los prospectos más prometedores."}, {"t": "Procesamiento de documentos con IA", "b": "La IA puede extraer y clasificar información de documentos de forma automática, reduciendo el trabajo manual en tareas administrativas repetitivas."}, {"t": "Análisis de datos con IA", "b": "Los modelos de IA pueden identificar patrones en grandes volúmenes de datos que serían difíciles de detectar manualmente, apoyando decisiones más informadas."}, {"t": "Automatización de redes sociales con IA", "b": "Programar y optimizar contenido para redes sociales mediante IA permite mantener presencia constante sin dedicar horas diarias a la gestión manual."}, {"t": "Flujos de trabajo automatizados", "b": "Conectar distintas herramientas en un flujo de trabajo automatizado elimina tareas manuales repetitivas entre aplicaciones que antes requerían intervención humana."}, {"t": "Agentes autónomos", "b": "Los agentes autónomos pueden ejecutar secuencias completas de tareas hacia un objetivo definido, ajustando su comportamiento según los resultados intermedios que van obteniendo."}, {"t": "Integración entre aplicaciones", "b": "Conectar distintas aplicaciones mediante integraciones o APIs evita la duplicación manual de información entre sistemas separados."}, {"t": "IA aplicada a la programación", "b": "La inteligencia artificial puede asistir en la escritura y depuración de código, acelerando el desarrollo aunque sin eliminar la necesidad de comprensión técnica del programador."}, {"t": "Ciberseguridad para pequeños negocios", "b": "Un negocio pequeño también es blanco de ataques informáticos, especialmente por manejar datos de clientes y pagos. Medidas básicas de seguridad son tan necesarias como en una empresa grande."}, {"t": "Contraseñas y autenticación", "b": "Usar contraseñas únicas y verificación en dos pasos reduce drásticamente el riesgo de acceso no autorizado a cuentas importantes."}, {"t": "Copias de seguridad", "b": "Mantener copias de seguridad regulares de información crítica evita pérdidas irreversibles ante fallos técnicos, robos o ataques informáticos."}, {"t": "Actualizaciones de software", "b": "Mantener el software actualizado corrige vulnerabilidades conocidas que de otro modo quedan abiertas a posibles ataques."}, {"t": "Redes sociales y algoritmos", "b": "Entender cómo priorizan contenido los algoritmos de cada plataforma ayuda a crear publicaciones con mayor probabilidad de alcance orgánico."}, {"t": "Almacenamiento en la nube", "b": "Guardar archivos en la nube facilita el acceso desde distintos dispositivos y reduce el riesgo de pérdida frente al almacenamiento local único."}, {"t": "Virtualización", "b": "La virtualización permite ejecutar varios sistemas independientes en un mismo equipo físico, útil para pruebas o para aislar entornos de trabajo distintos."}, {"t": "Herramientas de productividad digital", "b": "Aplicaciones de gestión de tareas, notas y calendarios, bien integradas, reducen la carga mental de recordar pendientes de forma manual."}, {"t": "Hojas de cálculo avanzadas", "b": "Dominar fórmulas y funciones avanzadas en hojas de cálculo permite automatizar cálculos y análisis que de otra forma tomarían horas manuales."}, {"t": "Bases de datos relacionales", "b": "Las bases de datos relacionales organizan información en tablas conectadas entre sí, evitando la duplicación y facilitando consultas complejas."}, {"t": "Bases de datos no relacionales", "b": "Las bases de datos no relacionales ofrecen mayor flexibilidad para datos poco estructurados, siendo comunes en aplicaciones modernas de gran escala."}, {"t": "Desarrollo backend", "b": "El backend gestiona la lógica y los datos detrás de una aplicación, invisibles para el usuario pero esenciales para que todo funcione correctamente."}, {"t": "Desarrollo frontend", "b": "El frontend es la parte visible e interactiva de una aplicación, responsable directo de la experiencia que percibe el usuario final."}, {"t": "Control de versiones colaborativo", "b": "Trabajar en equipo sobre un mismo proyecto de código exige buenas prácticas de ramas y fusiones para evitar conflictos entre cambios simultáneos."}, {"t": "Pruebas de software", "b": "Probar el software antes de lanzarlo detecta errores que, de llegar al usuario final, resultan mucho más costosos de corregir."}, {"t": "Documentación técnica", "b": "Documentar el funcionamiento de un sistema facilita que otras personas, o uno mismo en el futuro, entiendan decisiones tomadas durante el desarrollo."}, {"t": "Metodologías ágiles", "b": "Dividir el desarrollo de un proyecto en ciclos cortos con entregas frecuentes permite ajustar el rumbo según retroalimentación temprana."}, {"t": "Inteligencia artificial en educación", "b": "La IA puede personalizar el ritmo y el contenido de aprendizaje según el nivel de cada estudiante, algo difícil de lograr en un aula tradicional."}, {"t": "Inteligencia artificial en salud", "b": "La IA apoya el diagnóstico médico al identificar patrones en imágenes o datos clínicos, aunque la decisión final sigue requiriendo criterio profesional humano."}, {"t": "Automóviles autónomos", "b": "Los vehículos autónomos combinan visión artificial, sensores y algoritmos de decisión en tiempo real para navegar sin intervención humana directa."}, {"t": "Robótica", "b": "La robótica combina hardware físico con software de control para ejecutar tareas en el mundo real, desde manufactura hasta asistencia doméstica."}, {"t": "Realidad virtual y aumentada", "b": "Estas tecnologías amplían o sustituyen la percepción del entorno físico, con aplicaciones que van del entretenimiento a la capacitación profesional."}, {"t": "Blockchain", "b": "El blockchain es un registro distribuido que permite verificar transacciones sin depender de una autoridad central única, con aplicaciones más allá de las criptomonedas."}, {"t": "Criptomonedas (tecnología)", "b": "Las criptomonedas funcionan sobre redes descentralizadas que registran transacciones de forma pública y verificable, sin intermediarios bancarios tradicionales."}, {"t": "Computación cuántica", "b": "La computación cuántica promete resolver ciertos problemas de forma exponencialmente más rápida que las computadoras clásicas, aunque su aplicación práctica aún está en desarrollo."}, {"t": "Historia de la computación", "b": "Conocer la evolución de la computación, desde las primeras máquinas hasta los sistemas actuales, da contexto para entender por qué la tecnología funciona como lo hace hoy."}, {"t": "Modelos open source", "b": "El software de código abierto permite estudiar, modificar y reutilizar herramientas existentes, acelerando el aprendizaje y reduciendo costos de desarrollo."}, {"t": "Costos de infraestructura tecnológica", "b": "Elegir entre infraestructura propia o servicios en la nube depende del volumen de uso y del presupuesto disponible del proyecto."}, {"t": "Escalabilidad de sistemas", "b": "Diseñar un sistema pensando en su crecimiento futuro evita reconstrucciones costosas cuando la demanda supera la capacidad inicial."}, {"t": "Interfaces de usuario", "b": "Una interfaz clara e intuitiva reduce la curva de aprendizaje de cualquier aplicación, sin importar cuán potente sea su funcionalidad interna."}, {"t": "Experiencia de usuario (UX)", "b": "Diseñar pensando en las necesidades reales del usuario, y no solo en la estética, mejora la adopción y satisfacción con cualquier producto digital."}, {"t": "Automatización del hogar", "b": "Conectar dispositivos del hogar a sistemas centralizados permite controlar iluminación, seguridad y climatización de forma remota y programada."}, {"t": "Impresión 3D", "b": "La impresión 3D permite fabricar piezas físicas a partir de diseños digitales, útil tanto para prototipos como para producción de bajo volumen."}, {"t": "Drones", "b": "Los drones combinan sensores, cámaras y control remoto para tareas de monitoreo, fotografía o entrega, ampliando posibilidades antes limitadas al acceso físico directo."}, {"t": "Redes neuronales", "b": "Las redes neuronales imitan de forma simplificada el funcionamiento de las neuronas biológicas para reconocer patrones complejos en los datos de entrenamiento."}, {"t": "Entrenamiento de modelos de IA", "b": "Entrenar un modelo de IA requiere grandes cantidades de datos de calidad y ajuste cuidadoso de parámetros para lograr resultados confiables."}, {"t": "Sesgos en modelos de IA", "b": "Un modelo de IA entrenado con datos sesgados reproduce y a veces amplifica esos sesgos en sus resultados, lo que exige revisión crítica constante."}, {"t": "Privacidad de datos", "b": "Recopilar solo los datos necesarios, y protegerlos adecuadamente, reduce riesgos legales y de reputación frente a filtraciones de información."}, {"t": "Automatización de reportes", "b": "Generar reportes automáticos a partir de datos actualizados ahorra tiempo recurrente y reduce errores frente a la elaboración manual repetida."}, {"t": "Herramientas de diseño digital", "b": "Dominar herramientas de diseño gráfico digital permite crear materiales de marketing y presentación sin depender siempre de servicios externos."}, {"t": "Edición de vídeo digital", "b": "Editar vídeo de forma básica es cada vez más accesible y necesario para comunicar productos y servicios en plataformas dominadas por contenido audiovisual."}, {"t": "Comercio conversacional con IA", "b": "Integrar asistentes de IA en canales de venta permite atender consultas de clientes las 24 horas sin depender de personal humano constante."}, {"t": "Automatización de inventario con tecnología", "b": "Sistemas conectados pueden actualizar el inventario en tiempo real conforme ocurren las ventas, reduciendo errores de conteo manual."}, {"t": "Pagos digitales", "b": "Los sistemas de pago digital agilizan las transacciones y amplían las formas en que un negocio puede cobrar, más allá del efectivo."}, {"t": "Tendencias tecnológicas emergentes", "b": "Mantenerse informado sobre nuevas tecnológicas relevantes para el propio sector permite adoptar ventajas competitivas antes que la mayoría del mercado. n Finanzas e inversiones"}], "Finanzas e inversiones": [{"t": "Presupuesto personal", "b": "Elaborar un presupuesto mensual, comparando ingresos y gastos reales, es el primer paso para tomar control consciente de las finanzas personales."}, {"t": "Ahorro (finanzas personales)", "b": "Separar un porcentaje fijo del ingreso apenas se recibe, antes de gastar en otras cosas, convierte el ahorro en un hábito automático en lugar de una decisión repetida cada mes."}, {"t": "Deudas (finanzas personales)", "b": "Distinguir entre deuda que genera valor futuro y deuda de consumo puro ayuda a priorizar cuáles pagar primero y cuáles evitar contraer."}, {"t": "Crédito (finanzas personales)", "b": "Usar el crédito de forma moderada y pagarlo a tiempo construye un historial que facilita futuras oportunidades de financiamiento en mejores condiciones."}, {"t": "Fondo de emergencia", "b": "Contar con un fondo equivalente a varios meses de gastos esenciales protege frente a imprevistos sin necesidad de recurrir a deuda costosa."}, {"t": "Ingresos personales", "b": "Diversificar las fuentes de ingreso, en lugar de depender de una sola, reduce el riesgo financiero ante la pérdida de cualquiera de ellas."}, {"t": "Gastos personales", "b": "Revisar periódicamente los gastos recurrentes suele revelar suscripciones o costos innecesarios que pasan desapercibidos en el día a día."}, {"t": "Patrimonio personal", "b": "Calcular el patrimonio neto de forma periódica permite ver el progreso financiero real más allá de las fluctuaciones mensuales de ingreso."}, {"t": "Inflación", "b": "La inflación reduce el poder adquisitivo del dinero con el tiempo, lo que hace que mantener ahorros solo en efectivo pierda valor real gradualmente."}, {"t": "Interés compuesto", "b": "El interés compuesto hace que el dinero invertido crezca de forma acelerada con el tiempo, premiando especialmente el inicio temprano de la inversión."}, {"t": "Acciones", "b": "Invertir en acciones significa comprar una parte proporcional de una empresa, con potencial de ganancia por valorización y por dividendos."}, {"t": "ETFs", "b": "Los fondos cotizados permiten invertir en una canasta diversificada de activos con una sola compra, reduciendo el riesgo frente a invertir en una sola acción."}, {"t": "Bonos", "b": "Los bonos representan préstamos a una entidad, generalmente con menor riesgo y menor rentabilidad esperada que las acciones."}, {"t": "Fondos de inversión", "b": "Los fondos de inversión agrupan el capital de varios inversionistas, gestionado profesionalmente, para acceder a diversificación sin gestionar cada activo individualmente."}, {"t": "Bienes raíces como inversión", "b": "Invertir en bienes raíces puede generar ingresos por renta y valorización, aunque exige mayor capital inicial y menor liquidez que otros activos."}, {"t": "Oro como inversión", "b": "El oro se usa tradicionalmente como reserva de valor frente a la inflación y la incertidumbre económica, aunque no genera ingresos pasivos por sí mismo."}, {"t": "Commodities", "b": "Invertir en materias primas expone al inversionista a ciclos de oferta y demanda global distintos a los de las acciones o bonos tradicionales."}, {"t": "Criptomonedas como inversión", "b": "Las criptomonedas ofrecen alta volatilidad y potencial de rentabilidad, junto con un riesgo significativamente mayor que activos financieros tradicionales."}, {"t": "Inversiones empresariales", "b": "Invertir directamente en negocios, propios o de terceros, puede ofrecer mayor rentabilidad potencial a cambio de menor liquidez y mayor riesgo operativo."}, {"t": "Diversificación de inversiones", "b": "Repartir el capital entre distintos tipos de activos reduce el impacto de que uno solo de ellos tenga un mal desempeño."}, {"t": "Riesgo frente a rentabilidad", "b": "Toda inversión implica un equilibrio entre el riesgo asumido y la rentabilidad esperada; buscar alta rentabilidad sin evaluar el riesgo asociado suele salir caro."}, {"t": "Inversión a largo plazo", "b": "Mantener inversiones durante periodos largos suaviza el impacto de la volatilidad de corto plazo y aprovecha mejor el efecto del interés compuesto."}, {"t": "Trading", "b": "El trading busca ganancias en periodos cortos aprovechando movimientos de precio, exigiendo disciplina, gestión de riesgo y tiempo de dedicación distintos a la inversión de largo plazo."}, {"t": "Forex", "b": "El mercado de divisas mueve grandes volúmenes diarios y ofrece alta liquidez, pero también alta volatilidad que exige gestión de riesgo estricta."}, {"t": "Trading de acciones", "b": "Operar acciones en el corto plazo requiere análisis técnico y gestión de riesgo distintos a la estrategia de comprar y mantener a largo plazo."}, {"t": "Trading de criptomonedas", "b": "El trading de criptomonedas combina alta volatilidad con mercados que operan las 24 horas, exigiendo especial disciplina para evitar decisiones impulsivas."}, {"t": "Análisis técnico", "b": "El análisis técnico estudia el comportamiento histórico del precio para identificar patrones que puedan repetirse en el futuro cercano."}, {"t": "Análisis fundamental", "b": "El análisis fundamental evalúa la salud financiera real de una empresa o activo para estimar su valor más allá del precio actual de mercado."}, {"t": "Velas japonesas", "b": "Las velas japonesas representan gráficamente el movimiento del precio en un periodo determinado, siendo una herramienta visual central del análisis técnico."}, {"t": "Tendencias en trading", "b": "Identificar si el mercado está en tendencia alcista, bajista o lateral orienta qué tipo de estrategia aplicar en cada momento."}, {"t": "Soportes y resistencias", "b": "Los soportes y resistencias son niveles de precio donde históricamente el mercado ha tendido a rebotar o frenar su movimiento."}, {"t": "Volumen de mercado", "b": "El volumen de operaciones confirma o pone en duda la fuerza de un movimiento de precio, siendo un complemento importante al análisis de tendencia."}, {"t": "Indicadores técnicos", "b": "Los indicadores técnicos procesan datos de precio y volumen para generar señales que apoyen la toma de decisiones de entrada o salida."}, {"t": "Gestión del riesgo en trading", "b": "Definir de antemano cuánto capital se está dispuesto a perder en cada operación protege la cuenta frente a una racha de pérdidas."}, {"t": "Stop loss", "b": "Establecer un punto de salida automático ante pérdidas limita el daño de una operación que se mueve en contra antes de que empeore."}, {"t": "Take profit", "b": "Definir un objetivo de ganancia antes de entrar a una operación evita la tentación de mantenerla más tiempo del razonable por codicia."}, {"t": "Tamaño de posición", "b": "Ajustar el tamaño de cada operación según el capital total disponible evita que una sola pérdida comprometa gran parte de la cuenta."}, {"t": "Psicología del trading", "b": "El miedo y la codicia suelen ser los principales enemigos de un trader, llevando a decisiones que contradicen el plan previamente establecido."}, {"t": "Backtesting", "b": "Probar una estrategia contra datos históricos antes de aplicarla con dinero real ayuda a evaluar su viabilidad de forma más objetiva."}, {"t": "Estrategias de trading", "b": "Una estrategia clara y probada, aplicada con disciplina, suele rendir mejor en el tiempo que decisiones improvisadas operación por operación."}, {"t": "Diario de trading", "b": "Registrar cada operación, incluyendo el razonamiento detrás de ella, permite identificar patrones de error y mejorar de forma sistemática."}, {"t": "Oferta y demanda (economía)", "b": "Los precios de mercado reflejan el equilibrio entre lo que los compradores están dispuestos a pagar y lo que los vendedores están dispuestos a ofrecer."}, {"t": "Inflación (economía)", "b": "Un nivel moderado de inflación es normal en muchas economías, pero una inflación descontrolada erosiona rápidamente el poder adquisitivo de la población."}, {"t": "Tasas de interés", "b": "Las tasas de interés influyen en el costo del crédito y en el atractivo relativo del ahorro frente al consumo o la inversión."}, {"t": "Bancos centrales", "b": "Los bancos centrales regulan la política monetaria de un país, influyendo en la inflación, las tasas de interés y la estabilidad económica general."}, {"t": "Producto interno bruto (PIB)", "b": "El PIB mide el valor total de bienes y servicios producidos en una economía, siendo un indicador clave de su crecimiento o contracción."}, {"t": "Desempleo", "b": "La tasa de desempleo refleja la salud del mercado laboral y suele moverse en sentido contrario al crecimiento económico general."}, {"t": "Ciclos económicos", "b": "Las economías atraviesan ciclos alternos de expansión y contracción, y entender esta dinámica ayuda a tomar decisiones financieras más informadas según la fase actual."}, {"t": "Recesiones", "b": "Una recesión implica una contracción sostenida de la actividad económica, afectando empleo, inversión y consumo de forma generalizada."}, {"t": "Política monetaria", "b": "La política monetaria usa herramientas como las tasas de interés para influir en la inflación y el nivel de actividad económica."}, {"t": "Política fiscal", "b": "La política fiscal, mediante impuestos y gasto público, es la otra gran herramienta de los gobiernos para influir en la economía."}, {"t": "Mercados financieros", "b": "Los mercados financieros conectan a quienes necesitan capital con quienes buscan invertirlo, siendo el mecanismo central de asignación de recursos en una economía."}, {"t": "Economía mundial", "b": "Los eventos económicos de las principales potencias suelen tener efectos indirectos en economías más pequeñas conectadas por comercio o inversión internacional."}, {"t": "Educación financiera", "b": "Aprender conceptos financieros básicos desde temprano permite tomar mejores decisiones de forma acumulativa a lo largo de toda la vida."}, {"t": "Metas financieras", "b": "Definir metas financieras concretas y con plazo, como comprar una vivienda o jubilarse a cierta edad, orienta las decisiones diarias de ahorro e inversión."}, {"t": "Planificación de jubilación", "b": "Comenzar a ahorrar para el retiro lo antes posible aprovecha al máximo el efecto del interés compuesto en un horizonte de décadas."}, {"t": "Seguros financieros", "b": "Contratar seguros adecuados protege el patrimonio frente a eventos imprevistos que, sin cobertura, podrían destruir años de ahorro en un solo incidente."}, {"t": "Impuestos personales", "b": "Entender las obligaciones tributarias personales evita sanciones y permite aprovechar legalmente beneficios o deducciones disponibles."}, {"t": "Costo de oportunidad", "b": "Cada decisión financiera implica renunciar a otras alternativas posibles; evaluar el costo de oportunidad ayuda a elegir mejor entre opciones similares."}, {"t": "Diversificación geográfica de inversiones", "b": "Invertir en distintos países o regiones reduce el riesgo asociado a la situación económica particular de un solo mercado."}, {"t": "Rebalanceo de portafolio", "b": "Ajustar periódicamente la proporción de activos en una cartera mantiene el nivel de riesgo deseado conforme cambian los precios de cada activo."}, {"t": "Perfil de riesgo del inversionista", "b": "Conocer la propia tolerancia al riesgo, antes de invertir, evita tomar decisiones basadas en el miedo durante caídas normales del mercado."}, {"t": "Interés simple frente a compuesto", "b": "Entender la diferencia entre interés simple y compuesto es clave para evaluar correctamente préstamos, ahorros e inversiones a distintos plazos."}, {"t": "Liquidez financiera", "b": "La liquidez mide qué tan rápido un activo puede convertirse en efectivo sin perder valor significativo, un factor clave en momentos de necesidad urgente."}, {"t": "Apalancamiento financiero", "b": "Usar apalancamiento amplifica tanto las ganancias como las pérdidas potenciales, por lo que exige un manejo de riesgo especialmente cuidadoso."}, {"t": "Dividendos", "b": "Las empresas que reparten dividendos ofrecen un flujo de ingresos periódico a sus accionistas, además de la posible valorización de la acción."}, {"t": "Valorización de empresas", "b": "Estimar el valor real de una empresa, más allá de su precio de mercado actual, es la base del análisis fundamental para invertir con criterio."}, {"t": "Ciclo del mercado bursátil", "b": "Los mercados bursátiles atraviesan fases de optimismo y pesimismo que no siempre reflejan los fundamentos económicos reales de las empresas involucradas."}, {"t": "Fondos indexados", "b": "Los fondos indexados replican el comportamiento de un índice de mercado completo, ofreciendo diversificación amplia con costos de gestión generalmente bajos."}, {"t": "Planificación patrimonial", "b": "Organizar de forma anticipada la distribución del patrimonio evita conflictos y pérdidas de valor innecesarias en el futuro."}, {"t": "Finanzas para pequeños negocios", "b": "Separar las finanzas personales de las del negocio, desde el inicio, evita confusiones que dificultan medir la rentabilidad real de cada uno."}, {"t": "Capital de trabajo", "b": "Contar con suficiente capital de trabajo permite cubrir las operaciones diarias de un negocio sin depender de financiamiento urgente y costoso."}, {"t": "Financiamiento para negocios", "b": "Elegir entre financiamiento propio, crédito o inversionistas externos depende del control que se quiera mantener y del costo de cada opción."}, {"t": "Historial crediticio", "b": "Un buen historial crediticio, construido con pagos puntuales, amplía las opciones de financiamiento futuro en mejores condiciones."}, {"t": "Tasa de interés efectiva", "b": "Comparar créditos usando la tasa de interés efectiva, y no solo la nominal, revela el costo real de cada opción de financiamiento."}, {"t": "Ahorro programado", "b": "Automatizar transferencias periódicas hacia una cuenta de ahorro específica reduce la tentación de gastar ese dinero en otros fines."}, {"t": "Finanzas conductuales", "b": "Las finanzas conductuales estudian cómo los sesgos psicológicos llevan a decisiones financieras irracionales, incluso en personas con buen conocimiento técnico."}, {"t": "Aversión a la pérdida", "b": "Las personas suelen sentir con más intensidad una pérdida que una ganancia equivalente, lo que puede llevar a decisiones financieras poco óptimas."}, {"t": "Efecto manada en inversiones", "b": "Seguir decisiones de inversión solo porque otros las están tomando, sin análisis propio, suele amplificar burbujas y caídas de mercado."}, {"t": "Planificación de metas a corto plazo", "b": "Las metas financieras de corto plazo, como un fondo de vacaciones, requieren instrumentos de bajo riesgo y alta liquidez frente a metas de largo plazo."}, {"t": "Planificación de metas a largo plazo", "b": "Las metas de largo plazo permiten asumir mayor riesgo en la inversión, ya que hay más tiempo para recuperarse de caídas temporales del mercado."}, {"t": "Costos de transacción en inversión", "b": "Las comisiones y costos asociados a comprar y vender activos reducen la rentabilidad neta, especialmente en estrategias de operación frecuente."}, {"t": "Inversión inmobiliaria para renta", "b": "Comprar propiedades para alquilar exige evaluar no solo el precio de compra, sino también gastos de mantenimiento, vacancia y gestión."}, {"t": "Análisis de estados financieros", "b": "Leer estados financieros básicos de una empresa permite evaluar su solidez antes de invertir, más allá de las noticias o el ánimo del mercado."}, {"t": "Deuda pública", "b": "El nivel de endeudamiento de un país influye en su estabilidad económica y en la confianza de los inversionistas internacionales."}, {"t": "Tipo de cambio", "b": "Las fluctuaciones del tipo de cambio afectan directamente el costo de importar, exportar o invertir en activos denominados en otra moneda."}, {"t": "Reservas internacionales", "b": "Las reservas de un banco central actúan como respaldo frente a crisis externas, influyendo en la estabilidad de la moneda local."}, {"t": "Mercados emergentes", "b": "Invertir en mercados emergentes ofrece mayor potencial de crecimiento junto con mayor volatilidad e incertidumbre política frente a mercados desarrollados."}, {"t": "Educación sobre criptoactivos", "b": "Entender la tecnología detrás de las criptomonedas, no solo su precio, ayuda a evaluar de forma más informada su papel dentro de un portafolio."}, {"t": "Wallets y custodia de criptoactivos", "b": "Elegir entre custodia propia o en un exchange implica un equilibrio entre control directo y comodidad, cada uno con riesgos distintos."}, {"t": "Planeación financiera familiar", "b": "Alinear metas y decisiones financieras entre miembros de una familia evita conflictos y mejora la efectividad del ahorro conjunto."}, {"t": "Finanzas para freelancers", "b": "Los ingresos variables de un freelancer exigen un manejo financiero más conservador, con reservas mayores para cubrir meses de menor actividad."}, {"t": "Errores financieros comunes", "b": "Gastar por encima del ingreso, no llevar registro de gastos y no tener fondo de emergencia figuran entre los errores financieros más frecuentes y evitables."}, {"t": "Salud financiera general", "b": "Revisar periódicamente indicadores como nivel de deuda, ahorro y patrimonio da una visión objetiva de la salud financiera personal más allá de la sensación subjetiva."}, {"t": "Inversión en startups", "b": "Invertir en empresas emergentes ofrece alto potencial de retorno junto con un riesgo elevado de pérdida total del capital invertido."}, {"t": "Criptomonedas: stablecoins", "b": "Las stablecoins buscan mantener un valor estable, generalmente atado a una moneda tradicional, siendo útiles para reducir la volatilidad dentro del ecosistema cripto."}, {"t": "Finanzas descentralizadas (DeFi)", "b": "Las finanzas descentralizadas ofrecen servicios financieros tradicionales, como préstamos, sin intermediarios bancarios, apoyadas en contratos inteligentes."}, {"t": "Planificación de herencia", "b": "Definir con anticipación cómo se distribuirá el patrimonio evita disputas familiares y asegura que los bienes se manejen según la voluntad del titular."}, {"t": "Independencia financiera temprana", "b": "Alcanzar la independencia financiera antes de la edad tradicional de jubilación exige tasas de ahorro elevadas y decisiones de inversión disciplinadas durante años."}, {"t": "Revisión anual de finanzas personales", "b": "Hacer un balance financiero completo una vez al año permite ajustar metas y estrategias según los cambios reales de ingresos y prioridades. n Desarrollo personal y conocimiento"}], "Desarrollo personal y conocimiento": [{"t": "Disciplina", "b": "La disciplina consiste en actuar según lo planeado incluso cuando la motivación del momento falta. Es más confiable a largo plazo que depender solo del entusiasmo inicial."}, {"t": "Crear hábitos", "b": "Los hábitos se forman con repetición constante en contextos similares, no con fuerza de voluntad aislada. Empezar con versiones pequeñas del hábito facilita su consolidación."}, {"t": "Rutinas", "b": "Una rutina bien diseñada reduce la cantidad de decisiones diarias necesarias, liberando energía mental para tareas que realmente requieren pensamiento activo."}, {"t": "Constancia", "b": "Mantener el esfuerzo de forma sostenida, aunque sea moderado, produce mejores resultados a largo plazo que picos intensos seguidos de abandono."}, {"t": "Productividad", "b": "Ser productivo no significa hacer más cosas, sino avanzar en lo que realmente importa. Priorizar mal puede generar mucha actividad sin resultados relevantes."}, {"t": "Gestión del tiempo", "b": "Organizar el tiempo según prioridades reales, y no solo según urgencia, evita que lo importante quede siempre relegado a lo urgente del momento."}, {"t": "Prioridades", "b": "Definir con claridad qué es realmente prioritario evita dispersar el esfuerzo en tareas de bajo impacto que solo generan sensación de ocupación."}, {"t": "Procrastinación", "b": "Postergar tareas importantes suele originarse en el malestar asociado a iniciarlas, no en falta de tiempo real. Dividir la tarea en pasos pequeños reduce esa resistencia inicial."}, {"t": "Control de distracciones", "b": "Identificar y eliminar las fuentes recurrentes de distracción del entorno de trabajo mejora la concentración más que intentar resistirlas con pura fuerza de voluntad."}, {"t": "Cumplimiento de objetivos", "b": "Definir objetivos específicos y medibles, con plazos claros, aumenta significativamente la probabilidad de cumplirlos frente a metas vagas."}, {"t": "Voluntad", "b": "La voluntad funciona como un recurso limitado que se agota con el uso durante el día, por lo que conviene reservarla para las decisiones más importantes."}, {"t": "Autocontrol", "b": "El autocontrol permite posponer una recompensa inmediata en favor de un beneficio mayor a futuro, siendo una habilidad entrenable con práctica deliberada."}, {"t": "Resistencia a la tentación", "b": "Reducir la exposición a tentaciones desde el diseño del entorno suele ser más efectivo que confiar únicamente en la fuerza de voluntad en el momento."}, {"t": "Tolerancia a la frustración", "b": "Aprender a seguir avanzando pese a resultados no inmediatos es una habilidad clave para sostener cualquier proyecto de largo plazo."}, {"t": "Perseverancia", "b": "La perseverancia distingue a quienes alcanzan metas difíciles de quienes abandonan ante los primeros obstáculos, incluso con talento inicial similar."}, {"t": "Capacidad de sacrificio", "b": "Renunciar a comodidades inmediatas en favor de un objetivo mayor exige claridad sobre el valor real de esa meta a largo plazo."}, {"t": "Control emocional", "b": "Reconocer y regular las propias emociones antes de actuar evita decisiones impulsivas que luego resultan difíciles de revertir."}, {"t": "Tomar decisiones difíciles", "b": "Las decisiones difíciles suelen implicar renunciar a algo valioso; posponerlas indefinidamente rara vez elimina el costo, solo lo aplaza."}, {"t": "Detectar errores", "b": "Revisar de forma honesta los propios errores, sin buscar excusas externas, es el primer paso indispensable para corregirlos de forma efectiva."}, {"t": "Pensamiento crítico", "b": "Pensar críticamente implica cuestionar supuestos propios y ajenos antes de aceptarlos como verdaderos, en lugar de repetir ideas sin evaluarlas."}, {"t": "Análisis de errores propios", "b": "Documentar qué salió mal y por qué, en lugar de solo lamentar el resultado, convierte cada error en una fuente concreta de aprendizaje."}, {"t": "Reconocer patrones", "b": "Identificar patrones recurrentes en los propios resultados, buenos o malos, permite anticipar y ajustar el comportamiento antes de que se repita el mismo error."}, {"t": "Aprender de fracasos", "b": "Un fracaso analizado con honestidad suele aportar más aprendizaje útil que un éxito no examinado, aunque sea más incómodo de revisar."}, {"t": "Identificar malas decisiones", "b": "Distinguir una mala decisión de un mal resultado es clave: una buena decisión puede salir mal por factores externos sin dejar de haber sido correcta."}, {"t": "Causa y efecto", "b": "Entender las causas reales detrás de un resultado, en lugar de quedarse en la superficie, permite intervenir donde realmente importa."}, {"t": "Sesgos cognitivos (desarrollo personal)", "b": "Conocer los sesgos cognitivos más comunes ayuda a detectar cuándo el propio juicio puede estar distorsionado por atajos mentales poco confiables."}, {"t": "Autoevaluación", "b": "Evaluarse a uno mismo con regularidad y honestidad, en lugar de esperar retroalimentación externa, acelera la detección temprana de áreas de mejora."}, {"t": "Experimentación personal", "b": "Probar distintos métodos o enfoques a pequeña escala, antes de comprometerse por completo, reduce el riesgo de invertir tiempo en algo que no funciona."}, {"t": "Mejora continua", "b": "Buscar pequeñas mejoras constantes, en lugar de esperar un cambio radical único, suele producir resultados más sostenibles en el tiempo."}, {"t": "Cómo estudiar", "b": "Estudiar de forma activa, resolviendo problemas y explicando conceptos con las propias palabras, es más efectivo que la simple relectura pasiva del material."}, {"t": "Memorización", "b": "Técnicas como la repetición espaciada aprovechan mejor la memoria a largo plazo que estudiar todo de una sola vez justo antes de necesitarlo."}, {"t": "Comprensión", "b": "Comprender un concepto implica poder aplicarlo en situaciones nuevas, no solo repetir su definición de memoria."}, {"t": "Lectura efectiva", "b": "Leer con un propósito claro, tomando notas o resumiendo ideas clave, retiene más información que la lectura pasiva sin intención definida."}, {"t": "Toma de apuntes", "b": "Tomar apuntes con las propias palabras, en lugar de copiar literalmente, obliga a procesar la información y mejora la retención posterior."}, {"t": "Práctica deliberada", "b": "La práctica deliberada se enfoca específicamente en las debilidades identificadas, con retroalimentación constante, a diferencia de la simple repetición sin dirección."}, {"t": "Repetición espaciada", "b": "Repasar información en intervalos crecientes de tiempo consolida la memoria a largo plazo de forma más eficiente que repasar todo de golpe."}, {"t": "Enseñar lo aprendido", "b": "Explicar un tema a otra persona revela rápidamente qué partes realmente se comprendieron y cuáles solo se memorizaron de forma superficial."}, {"t": "Resolver problemas", "b": "Enfrentar problemas nuevos, sin solución conocida de antemano, entrena una capacidad de razonamiento distinta a la aplicación de fórmulas ya aprendidas."}, {"t": "Aprender de experiencias propias", "b": "Reflexionar deliberadamente sobre experiencias vividas, en lugar de dejarlas pasar sin análisis, convierte la experiencia acumulada en aprendizaje utilizable."}, {"t": "Aprender de otras personas", "b": "Observar y preguntar a personas con más experiencia en un área acelera el aprendizaje frente a descubrir todo por cuenta propia."}, {"t": "Investigación personal", "b": "Desarrollar el hábito de investigar antes de opinar o decidir mejora significativamente la calidad de las conclusiones alcanzadas."}, {"t": "Buscar información confiable", "b": "No toda fuente de información tiene el mismo nivel de rigor; distinguir fuentes confiables de las que no lo son es una habilidad cada vez más necesaria."}, {"t": "Verificar fuentes", "b": "Contrastar una afirmación con más de una fuente independiente reduce el riesgo de aceptar información errónea o sesgada como si fuera un hecho."}, {"t": "Comparar fuentes", "b": "Comparar distintas perspectivas sobre un mismo tema revela matices y contradicciones que una sola fuente, por sí sola, no muestra."}, {"t": "Detectar información falsa", "b": "Revisar el origen, la fecha y la evidencia detrás de una afirmación ayuda a identificar información falsa o descontextualizada antes de compartirla."}, {"t": "Pensamiento científico", "b": "El pensamiento científico busca evidencia antes de aceptar una conclusión como válida, estando siempre dispuesto a revisarla ante nueva evidencia."}, {"t": "Formular preguntas", "b": "Formular preguntas precisas es a menudo más difícil, y más valioso, que encontrar respuestas a preguntas ya bien planteadas."}, {"t": "Crear hipótesis", "b": "Plantear explicaciones provisionales, que luego se pueden probar o descartar con evidencia, ordena el trial", "b": "La Revolución Industrial transformó radicalmente la producción y la organización social, sentando las bases del mundo económico moderno basado en la manufactura a gran escala."}, {"t": "Primera Guerra Mundial", "b": "La Primera Guerra Mundial redibujó fronteras y equilibrios de poder globales, dejando consecuencias políticas que influyeron directamente en conflictos posteriores."}, {"t": "Segunda Guerra Mundial", "b": "La Segunda Guerra Mundial marcó un punto de inflexión geopolítico y tecnológico, cuyas consecuencias siguen influyendo en instituciones internacionales actuales."}, {"t": "Guerra Fría", "b": "La Guerra Fría enfrentó a dos modelos ideológicos y económicos opuestos durante décadas, moldeando alianzas y conflictos regionales alrededor del mundo."}, {"t": "Historia de América", "b": "El continente americano combina herencias indígenas, coloniales y de independencia que explican gran parte de la diversidad cultural y política actual de la región."}, {"t": "Historia económica", "b": "Estudiar la historia económica revela cómo distintos modelos de producción y comercio han determinado el bienestar y el poder relativo de las naciones a lo largo del tiempo."}, {"t": "Historia de la tecnología", "b": "La evolución tecnológica, desde la rueda hasta la inteligencia artificial, muestra un patrón constante de aceleración en la capacidad humana de transformar su entorno."}, {"t": "Historia de las grandes civilizaciones", "b": "Comparar el auge y la caída de distintas civilizaciones revela patrones recurrentes relacionados con gestión de recursos, gobernanza y adaptación al cambio."}, {"t": "Cristianismo", "b": "El cristianismo, con sus distintas ramas, ha influido profundamente en la ética, el arte y las instituciones de gran parte del mundo occidental."}, {"t": "Judaísmo", "b": "El judaísmo, como una de las tradiciones monoteístas más antiguas, ha influido en el desarrollo ético y filosófico de otras religiones abrahámicas posteriores."}, {"t": "Islam", "b": "El islam, con sus fuentes textuales y tradiciones jurídicas propias, ha configurado la organización social, política y espiritual de numerosas civilizaciones a lo largo de la historia."}, {"t": "Hinduismo", "b": "El hinduismo combina una amplia diversidad de tradiciones, textos y prácticas, siendo una de las religiones vivas más antiguas del mundo."}, {"t": "Budismo", "b": "El budismo propone un camino de reducción del sufrimiento mediante la comprensión de la naturaleza de la mente y el desapego, con influencia filosófica más allá de lo estrictamente religioso."}, {"t": "Religiones antiguas", "b": "Las religiones politeístas antiguas explicaban fenómenos naturales y sociales a través de mitologías que hoy aportan contexto cultural e histórico valioso."}, {"t": "La Biblia", "b": "La Biblia, como conjunto de textos religiosos e históricos, ha influido profundamente en la literatura, el derecho y la ética de numerosas culturas."}, {"t": "Historia de las religiones", "b": "Comparar el origen y la evolución de distintas religiones revela patrones comunes en cómo las sociedades humanas han buscado explicar lo trascendente."}, {"t": "Teología", "b": "La teología estudia de forma sistemática las creencias religiosas, sus textos y su coherencia interna, más allá de la práctica devocional cotidiana."}, {"t": "Profecías religiosas", "b": "Las tradiciones proféticas de distintas religiones han influido históricamente en decisiones políticas y sociales, más allá de su interpretación estrictamente espiritual."}, {"t": "Escatología", "b": "La escatología estudia las creencias religiosas sobre el destino final del mundo y de la humanidad, presentes en prácticamente todas las tradiciones espirituales."}, {"t": "Apocalipsis (estudio religioso)", "b": "El estudio del apocalipsis como género literario religioso revela cómo distintas culturas han imaginado el fin de los tiempos y sus consecuencias morales."}, {"t": "Ética religiosa", "b": "Los sistemas éticos religiosos han influido históricamente en las leyes y normas sociales, incluso en sociedades que hoy se consideran predominantemente seculares."}, {"t": "Moral", "b": "La moral, entendida como el conjunto de principios que guían el comportamiento correcto, varía entre culturas pero comparte ciertos elementos comunes reconocibles."}, {"t": "Interpretación de textos religiosos", "b": "Distintas corrientes interpretan los mismos textos religiosos de formas diversas, lo que explica en parte la diversidad de tradiciones dentro de una misma religión."}, {"t": "Comparación entre religiones", "b": "Comparar las religiones principales revela tanto diferencias doctrinales importantes como similitudes notables en sus enseñanzas éticas fundamentales."}, {"t": "¿Cuál es el propósito de la vida?", "b": "Esta pregunta ha sido abordada históricamente desde la filosofía, la religión y, más recientemente, la ciencia, sin que exista una respuesta única aceptada universalmente."}, {"t": "¿Qué es la conciencia?", "b": "La naturaleza de la conciencia sigue siendo uno de los mayores misterios sin resolver, estudiado tanto desde la neurociencia como desde la filosofía de la mente."}, {"t": "¿Qué es la verdad?", "b": "Distintas corrientes filosóficas ofrecen definiciones diferentes de verdad, desde la correspondencia con los hechos hasta la coherencia interna de un sistema de creencias."}, {"t": "¿Existe Dios?", "b": "Esta pregunta ha generado siglos de debate filosófico y teológico, con argumentos tanto a favor como en contra que siguen discutiéndose en la actualidad."}, {"t": "¿Qué ocurre después de la muerte?", "b": "Las distintas tradiciones religiosas y filosóficas ofrecen respuestas muy diversas sobre lo que sucede tras la muerte, sin evidencia empírica concluyente disponible."}, {"t": "¿Qué es el bien y el mal?", "b": "La ética ha propuesto distintos marcos para definir el bien y el mal, desde consecuencias de los actos hasta principios universales independientes del resultado."}, {"t": "¿Tenemos libre albedrío?", "b": "El debate sobre el libre albedrío enfrenta posturas deterministas con otras que defienden algún grado de elección genuina, con implicaciones directas sobre la responsabilidad moral."}, {"t": "¿Qué hace que una persona sea feliz?", "b": "La investigación en psicología positiva sugiere que las relaciones significativas y el propósito influyen más en la felicidad sostenida que las circunstancias materiales aisladas."}, {"t": "¿Qué es la inteligencia?", "b": "Definir la inteligencia de forma completa sigue siendo un desafío, ya que abarca capacidades muy diversas que no siempre se correlacionan entre sí."}, {"t": "¿Qué es la realidad?", "b": "Distintas corrientes filosóficas cuestionan si la realidad percibida corresponde exactamente a una realidad externa objetiva o si está mediada de forma fundamental por la mente."}, {"t": "¿Podría existir vida extraterrestre?", "b": "La probabilidad estadística de vida en otros lugares del universo, dado su tamaño, contrasta con la ausencia de evidencia directa confirmada hasta el momento."}, {"t": "¿Cómo comenzó el universo?", "b": "La teoría del Big Bang es el modelo científico más aceptado sobre el origen del universo, aunque persisten preguntas abiertas sobre qué ocurrió antes de ese punto."}, {"t": "¿Qué límites tiene el conocimiento humano?", "b": "Existen preguntas que, por su naturaleza, podrían estar fuera del alcance actual o incluso futuro del conocimiento humano, lo que mantiene abierto el debate filosófico sobre sus límites."}, {"t": "Filosofía práctica", "b": "Aplicar ideas filosóficas, como las del estoicismo, a decisiones cotidianas ayuda a mantener la calma frente a situaciones fuera del propio control."}, {"t": "Gestión del fracaso", "b": "Aceptar el fracaso como parte natural de cualquier proceso de aprendizaje reduce el miedo paralizante a intentar cosas nuevas."}, {"t": "Curiosidad como motor de aprendizaje", "b": "Mantener una curiosidad activa por temas diversos amplía la capacidad de conectar ideas de campos aparentemente sin relación entre sí."}, {"t": "Autodisciplina en el aprendizaje autodidacta", "b": "Aprender por cuenta propia, sin la estructura de un curso formal, exige mayor autodisciplina para sostener el progreso sin supervisión externa."}, {"t": "Construcción de un sistema de conocimiento personal", "b": "Organizar lo aprendido en un sistema conectado, en lugar de notas sueltas, facilita encontrar y reutilizar ese conocimiento cuando realmente se necesita."}]};

    let textToType = "";
    let startTime;
    let timerRunning = false;

    const display = document.getElementById('text-display');
    const input = document.getElementById('input-field');
    const wpmEl = document.getElementById('wpm');
    const accuracyEl = document.getElementById('accuracy');

    function switchTab(tab) {
      document.getElementById('tab-btn-custom').classList.toggle('active', tab === 'custom');
      document.getElementById('tab-btn-topics').classList.toggle('active', tab === 'topics');
      document.getElementById('panel-custom').classList.toggle('active', tab === 'custom');
      document.getElementById('panel-topics').classList.toggle('active', tab === 'topics');
    }

    function initCategories() {
      const catSelect = document.getElementById('category-select');
      Object.keys(TOPICS).forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat + ' (' + TOPICS[cat].length + ')';
        catSelect.appendChild(opt);
      });
      populateTopics();
    }

    function populateTopics() {
      const cat = document.getElementById('category-select').value;
      const topicSelect = document.getElementById('topic-select');
      topicSelect.innerHTML = '';
      TOPICS[cat].forEach((item, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = item.t;
        topicSelect.appendChild(opt);
      });
      previewTopic();
    }

    function previewTopic() {
      const cat = document.getElementById('category-select').value;
      const idx = document.getElementById('topic-select').value;
      const item = TOPICS[cat][idx];
      document.getElementById('topic-preview').textContent = item ? item.b : '';
    }

    function loadTopicText() {
      const cat = document.getElementById('category-select').value;
      const idx = document.getElementById('topic-select').value;
      const item = TOPICS[cat][idx];
      if (!item) return;
      startTyping(item.b);
    }

    function loadRandomTopic() {
      const cats = Object.keys(TOPICS);
      const cat = cats[Math.floor(Math.random() * cats.length)];
      const list = TOPICS[cat];
      const idx = Math.floor(Math.random() * list.length);
      document.getElementById('category-select').value = cat;
      populateTopics();
      document.getElementById('topic-select').value = idx;
      previewTopic();
      startTyping(list[idx].b);
    }

    function loadCustomText() {
      const rawText = document.getElementById('custom-text').value.trim();
      if (!rawText) return;
      startTyping(rawText);
    }

    function startTyping(rawText) {
      textToType = rawText;
      display.innerHTML = '';

      // Envolver cada carácter en un <span> para colorearlo después
      textToType.split('').forEach((char, index) => {
        const charSpan = document.createElement('span');
        charSpan.innerText = char;
        if (index === 0) charSpan.classList.add('current');
        display.appendChild(charSpan);
      });

      input.value = '';
      input.disabled = false;
      input.focus();
      timerRunning = false;
      wpmEl.innerText = '0';
      accuracyEl.innerText = '100%';
    }

    input.addEventListener('input', () => {
      const arrayQuote = display.querySelectorAll('span');
      const arrayValue = input.value.split('');

      if (!timerRunning && input.value.length > 0) {
        startTime = new Date();
        timerRunning = true;
      }

      let correctChars = 0;

      arrayQuote.forEach((characterSpan, index) => {
        const character = arrayValue[index];

        characterSpan.classList.remove('current');

        if (character == null) {
          characterSpan.classList.remove('correct', 'incorrect');
        } else if (character === characterSpan.innerText) {
          characterSpan.classList.add('correct');
          characterSpan.classList.remove('incorrect');
          correctChars++;
        } else {
          characterSpan.classList.add('incorrect');
          characterSpan.classList.remove('correct');
        }

        if (index === arrayValue.length) {
          characterSpan.classList.add('current');
        }
      });

      // Calcular estadísticas
      if (timerRunning && arrayValue.length > 0) {
        const timeInMinutes = (new Date() - startTime) / 60000;
        const wpm = Math.round((arrayValue.length / 5) / timeInMinutes);
        const accuracy = Math.round((correctChars / arrayValue.length) * 100);

        wpmEl.innerText = wpm > 0 && isFinite(wpm) ? wpm : 0;
        accuracyEl.innerText = (accuracy || 0) + '%';
      }
    });

    initCategories();
  </script>
