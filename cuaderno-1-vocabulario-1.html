<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Cuaderno de Vocabulario 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Literata:ital,opsz,wght@0,18..144,400;0,18..144,600;1,18..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FAFAF7;
    --grid: #D7E3EC;
    --margin: #E3A6A0;
    --ink: #202B3A;
    --ink-soft: #64707F;
    --ink-faint: #97A1AC;
    --accent: #2C6E5D;
    --accent-dark: #1E5548;
    --accent-soft: #E1EFEA;
    --highlight: #F6D879;
    --card-line: #E3DFD3;
    --radius: 3px;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0; padding:0;
    background:
      linear-gradient(90deg, transparent 46px, var(--margin) 46px, var(--margin) 48px, transparent 48px),
      repeating-linear-gradient(var(--paper) 0px, var(--paper) 31px, var(--grid) 32px);
    background-color: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
  }

  body{ display:flex; justify-content:center; }

  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    padding: 18px 20px 40px 56px;
    display:flex;
    flex-direction:column;
  }

  .brand{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:6px;
  }
  .brand h1{ font-family:'Kalam', cursive; font-size:22px; font-weight:700; margin:0; color:var(--ink); }
  .brand .part{ font-size:12px; color:var(--ink-faint); font-weight:500; }

  .progress-wrap{ margin: 10px 0 20px; }
  .progress-label{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); margin-bottom:6px; }
  .progress-bar{ height:6px; background: var(--card-line); border-radius:6px; overflow:hidden; }
  .progress-fill{ height:100%; background: var(--accent); border-radius:6px; transition: width .35s ease; }

  .card{
    background: var(--paper);
    border: 1px solid var(--card-line);
    border-radius: var(--radius);
    padding: 22px 20px;
    flex:1;
    display:flex;
    flex-direction:column;
    animation: fadeIn .3s ease;
  }
  @keyframes fadeIn{ from{ opacity:0; transform: translateY(6px); } to{ opacity:1; transform: translateY(0); } }

  .step-kicker{
    font-size:11px; letter-spacing:.02em; color: var(--accent-dark);
    background: var(--accent-soft); display:inline-block; padding: 3px 9px;
    border-radius: 20px; margin-bottom: 16px; width:fit-content; font-weight:600;
  }

  .word-title{ font-family:'Kalam', cursive; font-size:38px; font-weight:700; color: var(--ink); line-height:1.05; margin: 0 0 4px; }
  .group-title{ font-family:'Kalam', cursive; font-size:26px; font-weight:700; margin: 0 0 4px; }
  .field-label{ font-size:12px; color:var(--ink-soft); margin: 18px 0 8px; font-weight:600; }
  .meaning-text{ font-family:'Literata', serif; font-size:19px; line-height:1.5; color: var(--ink); margin: 2px 0 0; }
  .sentence-flow{ font-family:'Literata', serif; font-size:18px; line-height:1.85; color: var(--ink); }

  .blank-input{
    font-family:'Literata', serif; font-size:18px; font-style:italic; color: var(--accent-dark);
    background: var(--accent-soft); border: none; border-bottom: 2px solid var(--accent);
    border-radius: 2px; padding: 1px 6px; min-width: 90px; width: auto; outline:none;
  }
  .blank-input:focus{ background:#fff; }

  textarea.own-sentence{
    font-family:'Literata', serif; font-size:17px; line-height:1.6; color: var(--ink);
    background: transparent; border:none; border-bottom: 2px solid var(--card-line);
    padding: 6px 2px; resize:none; outline:none; width:100%; min-height: 70px;
  }
  textarea.own-sentence:focus{ border-bottom-color: var(--accent); }

  .word-bank{ display:flex; flex-wrap:wrap; gap:6px; margin-top:18px; }
  .chip{ font-size:13px; background: var(--accent-soft); color: var(--accent-dark); padding:4px 10px; border-radius: 20px; font-weight:500; }

  .spacer{ flex:1; }
  .nav-row{ display:flex; gap:10px; margin-top: 24px; }

  button{ font-family:'Inter', sans-serif; font-size:15px; font-weight:600; border-radius: var(--radius); border: none; padding: 13px 18px; cursor:pointer; }
  .btn-primary{ background: var(--accent); color:#fff; flex:1; }
  .btn-primary:active{ background: var(--accent-dark); }
  .btn-ghost{ background: transparent; color: var(--ink-soft); border: 1px solid var(--card-line); }

  .home{ flex:1; display:flex; flex-direction:column; justify-content:center; text-align:left; }
  .home h1{ font-family:'Kalam', cursive; font-size:40px; margin:0 0 6px; line-height:1.05; }
  .home p{ font-family:'Literata', serif; font-size:16px; color: var(--ink-soft); line-height:1.5; max-width: 34ch; }
  .home-stat{ margin: 18px 0; font-size:14px; color: var(--ink-soft); }
  .home-stat strong{ color:var(--ink); }

  .link-btn{ background:none; border:none; color: var(--accent-dark); font-weight:600; font-size:14px; text-decoration: underline; padding: 10px 0; text-align:left; cursor:pointer; }

  .overview-grid{ display:grid; grid-template-columns: repeat(6, 1fr); gap:8px; margin: 14px 0 20px; overflow-y:auto; }
  .g-dot{ aspect-ratio:1; border-radius:6px; border:1px solid var(--card-line); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color: var(--ink-soft); background: var(--paper); cursor:pointer; }
  .g-dot.done{ background: var(--accent); color:#fff; border-color:var(--accent); }
  .g-dot.current{ border: 2px solid var(--accent-dark); color:var(--accent-dark); }

  .done-screen{ flex:1; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; }
  .done-screen h1{ font-family:'Kalam', cursive; font-size:34px; margin:0 0 10px; }
  .done-screen p{ font-family:'Literata', serif; font-size:16px; color:var(--ink-soft); line-height:1.5; }

  /* motivational stimulus */
  .motiv-hero{
    width:100%;
    border-radius: var(--radius);
    overflow:hidden;
    border: 1px solid var(--card-line);
    margin-bottom: 16px;
  }
  .motiv-hero img{ width:100%; display:block; }
  .motiv-caption{
    font-family:'Kalam', cursive;
    font-size: 15px;
    color: var(--ink-soft);
    padding: 8px 2px 0;
  }

  .motiv-screen{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  }
  .motiv-screen img{
    width: 78%;
    max-width: 300px;
    border-radius: var(--radius);
    border: 1px solid var(--card-line);
    margin-bottom: 18px;
  }
  .motiv-screen .motiv-kicker{
    font-size:11px; letter-spacing:.02em; color: var(--accent-dark);
    background: var(--accent-soft); padding: 3px 9px; border-radius: 20px; margin-bottom: 14px; font-weight:600;
  }
  .motiv-screen h2{
    font-family:'Kalam', cursive; font-size:26px; margin: 0 0 8px; line-height:1.15; max-width: 26ch;
  }
  .motiv-screen p{
    font-family:'Literata', serif; font-size:15px; color: var(--ink-soft); max-width: 30ch; line-height:1.5;
  }

  ::selection{ background: var(--highlight); }
</style>
</head>

onstrucción y decoración","sentence":"Recientemente se agregó el ________, el cual se oxida con el paso del tiempo y cambia de color."},{"word":"Lingote","meaning":"barra de metal refinado","sentence":"Cada ________ se obtiene fundiendo el mineral correspondiente dentro del horno."},{"word":"Poción","meaning":"bebida con efectos mágicos","sentence":"Antes de enfrentar al dragón, es recomendable beber una ________ de fortaleza."},{"word":"Encantamiento","meaning":"mejora mágica para un objeto","sentence":"Un buen ________ puede transformar una herramienta común en un arma verdaderamente poderosa."},{"word":"Experiencia","meaning":"puntos ganados al jugar, usados para encantar","sentence":"A medida que minas y combates, acumulas ________ que después usarás para encantar tus objetos."}],"paragraph_num":4,"paragraph_words":["cobre","lingote","poción","encantamiento","experiencia"],"paragraph_text":"Explorar el mundo de Minecraft significa reunir recursos antes de que caiga la noche. Entre los elementos que se mencionan en esta escena están ________, ________ y ________, acompañados de ________ y ________, puesto que, y de a poco la base se vuelve más fuerte y organizada."},{"group":5,"words":[{"word":"Zombie","meaning":"enemigo no muerto del juego","sentence":"Durante la noche, no es raro que un ________ aparezca cerca de la aldea."},{"word":"Esqueleto","meaning":"enemigo que dispara flechas","sentence":"El ________ dispara flechas a distancia, por lo tanto conviene cubrirte o acercarte rápidamente."},{"word":"Aldeano","meaning":"personaje no jugable que comercia","sentence":"Cada ________ tiene una profesión distinta, la cual determina qué objetos ofrece a cambio."},{"word":"Portal","meaning":"puerta que lleva a otra dimensión","sentence":"Para llegar al Nether, primero debes construir un ________ hecho de obsidiana."},{"word":"Dragón","meaning":"criatura poderosa y voladora","sentence":"El ________ del End es el enemigo final, así que prepárate con la mejor armadura p <script>
(function(){
  const DATA = JSON.parse(document.getElementById('data-json').textContent);
  const IMG_B64 = document.getElementById('motiv-image').textContent.trim();
  const IMG_SRC = 'data:image/jpeg;base64,' + IMG_B64;

  const NOTEBOOK_NUM = 1;
  const GROUP_OFFSET = 0; // global group number of the first group in this notebook, minus 1
  const GLOBAL_TOTAL = 360;
  const TOTAL_GROUPS = DATA.length;
  const MOTIV_EVERY = 15; // show a motivational break every N completed groups

  const CAPTIONS = [
    'Nadie ve el esfuerzo. Todos ven el resultado.',
    'Lo que hoy cuesta, mañana es fuerza.',
    'Cada palabra estudiada es una repetición más.',
    'El progreso no se nota hasta que ya no se puede ignorar.',
    'La constancia de hoy es la ventaja de mañana.',
    'No pares. Cada grupo completado es una repetición ganada.'
  ];

  const app = document.getElementById('app');

  // ---- Build flat step list ----
  const steps = [];
  DATA.forEach((g, gi) => {
    g.words.forEach((w, wi) => {
      steps.push({ type:'meaning', gi, wi });
      steps.push({ type:'fill', gi, wi });
      steps.push({ type:'own', gi, wi });
    });
    steps.push({ type:'paragraph', gi });
    if ((gi + 1) % MOTIV_EVERY === 0 && (gi + 1) !== TOTAL_GROUPS){
      steps.push({ type:'motiv', gi });
    }
  });
  const TOTAL_STEPS = steps.length;

  // ---- State ----
  let state = { stepIndex: 0, answers: {}, screen: 'loading' };
  let saveTimer = null;
  function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(persist, 400); }

  const STORAGE_KEY = 'vocab-progress-cuaderno-' + NOTEBOOK_NUM;

  let saveErrorLogged = false;
  function persist(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        stepIndex: state.stepIndex, answers: state.answers
      }));
    }catch(e){
      if(!saveErrorLogged){ console.error('No se pudo guardar el progreso en este navegador', e); saveErrorLogged = true; }
    }
  }

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        state.stepIndex = Math.min(parsed.stepIndex || 0, TOTAL_STEPS - 1);
        state.answers = parsed.answers || {};
      }
    }catch(e){ /* no previous progress, or storage blocked (e.g. some file:// setups) */ }
    state.screen = 'home';
    render();
  }

  function keyFor(step, extra){
    if(step.type === 'paragraph') return `p-${step.gi}-${extra}`;
    return `${step.type}-${step.gi}-${step.wi}`;
  }

  function groupStatus(gi){
    const s = steps[state.stepIndex];
    const curGi = s ? s.gi : 0;
    if(gi < curGi) return 'done';
    if(gi === curGi) return 'current';
    return 'pending';
  }

  function firstStepIndexOfGroup(gi){ return steps.findIndex(s => s.gi === gi && s.type !== 'motiv'); }

  function goNext(){
    if(state.stepIndex < TOTAL_STEPS - 1){
      state.stepIndex++;
      scheduleSave();
      render();
      window.scrollTo(0,0);
    } else {
      state.screen = 'finished';
      scheduleSave();
      render();
    }
  }
  function goBack(){
    if(state.stepIndex > 0){ state.stepIndex--; render(); window.scrollTo(0,0); }
  }
  function jumpToGroup(gi){
    state.stepIndex = firstStepIndexOfGroup(gi);
    state.screen = 'exercise';
    render();
    window.scrollTo(0,0);
  }

  function el(tag, cls, html){
    const e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }

  function render(){
    app.innerHTML = '';
    if(state.screen === 'home') return renderHome();
    if(state.screen === 'overview') return renderOverview();
    if(state.screen === 'finished') return renderFinished();
    return renderExercise();
  }

  function renderBrand(){
    const brand = el('div','brand');
    brand.appendChild(el('h1', null, 'Cuaderno de Vocabulario'));
    const globalFirst = GROUP_OFFSET + 1, globalLast = GROUP_OFFSET + TOTAL_GROUPS;
    brand.appendChild(el('div','part', `Cuaderno ${NOTEBOOK_NUM} de 4 · Grupos ${globalFirst}–${globalLast}`));
    app.appendChild(brand);
  }

  function renderHome(){
    renderBrand();
    const wrap = el('div','home');

    const hero = el('div','motiv-hero');
    const img = document.createElement('img');
    img.src = IMG_SRC;
    img.alt = 'Estímulo motivacional';
    hero.appendChild(img);
    hero.appendChild(el('div','motiv-caption', CAPTIONS[NOTEBOOK_NUM % CAPTIONS.length]));
    wrap.appendChild(hero);

    const started = state.stepIndex > 0;
    wrap.appendChild(el('h1', null, started ? 'Seguimos.' : 'Empecemos.'));
    wrap.appendChild(el('p', null, 'Un ejercicio a la vez: significado, completar la oración y tu propia oración. Al terminar cinco palabras, completas el párrafo.'));

    const curStep = steps[state.stepIndex];
    const curGroupGlobal = GROUP_OFFSET + curStep.gi + 1;
    const stat = el('div','home-stat', `Vas por el <strong>grupo ${curGroupGlobal}</strong> (${curStep.gi+1} de ${TOTAL_GROUPS} en este cuaderno).`);
    wrap.appendChild(stat);

    const nav = el('div','nav-row');
    const startBtn = el('button','btn-primary', started ? 'Continuar' : 'Comenzar');
    startBtn.onclick = () => { state.screen = 'exercise'; render(); };
    nav.appendChild(startBtn);
    wrap.appendChild(nav);

    const overviewBtn = el('button','link-btn', 'Ver todos los grupos de este cuaderno');
    overviewBtn.onclick = () => { state.screen = 'overview'; render(); };
    wrap.appendChild(overviewBtn);

    app.appendChild(wrap);
  }

  function renderOverview(){
    renderBrand();
    const wrap = el('div', null);
    wrap.style.display='flex'; wrap.style.flexDirection='column'; wrap.style.flex='1';
    wrap.appendChild(el('div','field-label', 'Toca un grupo para ir directo a él'));
    const grid = el('div','overview-grid');
    for(let gi=0; gi<TOTAL_GROUPS; gi++){
      const status = groupStatus(gi);
      const dot = el('div', `g-dot ${status}`, String(GROUP_OFFSET + gi + 1));
      dot.onclick = () => jumpToGroup(gi);
      grid.appendChild(dot);
    }
    wrap.appendChild(grid);
    const back = el('button','btn-ghost', 'Volver');
    back.onclick = () => { state.screen = 'home'; render(); };
    wrap.appendChild(back);
    app.appendChild(wrap);
  }

  function renderFinished(){
    renderBrand();
    const wrap = el('div','done-screen');
    wrap.appendChild(el('h1', null, `¡Cuaderno ${NOTEBOOK_NUM} completo!`));
    const globalFirst = GROUP_OFFSET + 1, globalLast = GROUP_OFFSET + TOTAL_GROUPS;
    const isLastBook = globalLast === GLOBAL_TOTAL;
    wrap.appendChild(el('p', null, isLastBook
      ? `Terminaste los 360 grupos y sus 360 párrafos de los 4 cuadernos. Todo el vocabulario, completo.`
      : `Terminaste los grupos ${globalFirst} a ${globalLast}. Sigue con el Cuaderno ${NOTEBOOK_NUM + 1} cuando quieras.`));
    const nav = el('div','nav-row');
    const overviewBtn = el('button','btn-primary', 'Ver grupos');
    overviewBtn.onclick = () => { state.screen = 'overview'; render(); };
    nav.appendChild(overviewBtn);
    wrap.appendChild(nav);
    app.appendChild(wrap);
  }

  function progressBar(){
    const s = steps[state.stepIndex];
    const wrap = el('div','progress-wrap');
    const label = el('div','progress-label');
    const left = el('span', null, `Grupo ${GROUP_OFFSET + s.gi + 1} de ${GLOBAL_TOTAL}`);
    const right = el('span', null, `Paso ${state.stepIndex+1} de ${TOTAL_STEPS}`);
    label.appendChild(left); label.appendChild(right);
    const bar = el('div','progress-bar');
    const fill = el('div','progress-fill');
    fill.style.width = ((state.stepIndex+1)/TOTAL_STEPS*100).toFixed(2) + '%';
    bar.appendChild(fill);
    wrap.appendChild(label); wrap.appendChild(bar);
    return wrap;
  }

  function navRow(onNext, nextLabel){
    const row = el('div','nav-row');
    const back = el('button','btn-ghost', 'Atrás');
    back.disabled = state.stepIndex === 0;
    back.style.opacity = back.disabled ? '0.4' : '1';
    back.onclick = goBack;
    const next = el('button','btn-primary', nextLabel || 'Siguiente');
    next.onclick = onNext;
    row.appendChild(back); row.appendChild(next);
    return row;
  }

  function renderExercise(){
    const step = steps[state.stepIndex];

    if(step.type === 'motiv'){
      renderBrand();
      const wrap = el('div','motiv-screen');
      wrap.appendChild(el('div','motiv-kicker', `${GROUP_OFFSET + step.gi + 1} grupos completados`));
      const img = document.createElement('img');
      img.src = IMG_SRC;
      img.alt = 'Estímulo motivacional';
      wrap.appendChild(img);
      const capIdx = Math.floor((step.gi+1)/MOTIV_EVERY + NOTEBOOK_NUM) % CAPTIONS.length;
      wrap.appendChild(el('h2', null, CAPTIONS[capIdx]));
      wrap.appendChild(el('p', null, 'Respira, estira los dedos y sigue con el siguiente grupo.'));
      const nav = el('div','nav-row');
      nav.style.width = '100%';
      const next = el('button','btn-primary', 'Seguir estudiando');
      next.onclick = goNext;
      nav.appendChild(next);
      wrap.appendChild(nav);
      app.appendChild(wrap);
      return;
    }

    const group = DATA[step.gi];
    renderBrand();
    app.appendChild(progressBar());
    const card = el('div','card');

    if(step.type === 'meaning'){
      const w = group.words[step.wi];
      card.appendChild(el('div','step-kicker', `Grupo ${group.group} · Palabra ${step.wi+1} de 5 · Significado`));
      card.appendChild(el('div','word-title', w.word));
      card.appendChild(el('div','meaning-text', w.meaning));
      card.appendChild(el('div','spacer'));
      card.appendChild(navRow(goNext));
    }
    else if(step.type === 'fill'){
      const w = group.words[step.wi];
      card.appendChild(el('div','step-kicker', `Grupo ${group.group} · Palabra ${step.wi+1} de 5 · Completa la oración`));
      card.appendChild(el('div','word-title', w.word));
      const flow = el('div','sentence-flow');
      const key = keyFor(step);
      const parts = w.sentence.split('________');
      parts.forEach((part, i) => {
        flow.appendChild(document.createTextNode(part));
        if(i < parts.length - 1){
          const input = document.createElement('input');
          input.type = 'text'; input.className = 'blank-input'; input.placeholder = '…';
          input.value = state.answers[key] || '';
          input.autocomplete = 'off'; input.autocapitalize = 'off'; input.spellcheck = false;
          input.oninput = (e) => { state.answers[key] = e.target.value; scheduleSave(); };
          flow.appendChild(input);
        }
      });
      card.appendChild(flow);
      card.appendChild(el('div','spacer'));
      card.appendChild(navRow(goNext));
    }
    else if(step.type === 'own'){
      const w = group.words[step.wi];
      card.appendChild(el('div','step-kicker', `Grupo ${group.group} · Palabra ${step.wi+1} de 5 · Tu propia oración`));
      card.appendChild(el('div','word-title', w.word));
      card.appendChild(el('div','field-label', `Escribe una oración usando "${w.word.toLowerCase()}"`));
      const key = keyFor(step);
      const ta = document.createElement('textarea');
      ta.className = 'own-sentence';
      ta.value = state.answers[key] || '';
      ta.placeholder = 'Escribe aquí…';
      ta.oninput = (e) => { state.answers[key] = e.target.value; scheduleSave(); };
      card.appendChild(ta);
      card.appendChild(el('div','spacer'));
      card.appendChild(navRow(goNext));
    }
    else if(step.type === 'paragraph'){
      card.appendChild(el('div','step-kicker', `Grupo ${group.group} · Párrafo ${group.paragraph_num}`));
      card.appendChild(el('div','group-title', 'Completa el párrafo'));
      const flow = el('div','sentence-flow');
      const parts = group.paragraph_text.split('________');
      parts.forEach((part, i) => {
        flow.appendChild(document.createTextNode(part));
        if(i < parts.length - 1){
          const key = keyFor(step, i);
          const input = document.createElement('input');
          input.type = 'text'; input.className = 'blank-input'; input.placeholder = '…';
          input.value = state.answers[key] || '';
          input.autocomplete = 'off'; input.autocapitalize = 'off'; input.spellcheck = false;
          input.oninput = (e) => { state.answers[key] = e.target.value; scheduleSave(); };
          flow.appendChild(input);
        }
      });
      card.appendChild(flow);
      const bank = el('div','word-bank');
      group.paragraph_words.forEach(word => bank.appendChild(el('span','chip', word)));
      card.appendChild(bank);
      card.appendChild(el('div','spacer'));
      const isLastGroup = step.gi === TOTAL_GROUPS - 1;
      card.appendChild(navRow(goNext, isLastGroup ? 'Terminar cuaderno' : 'Siguiente grupo →'));
    }

    app.appendChild(card);
  }

  load();
})();

</script>
</body>
</html>
