<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Atención al Cliente y Ventas</title>
    <style>
        :root {
            --bg-color: #f4f7f9;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text: #1e293b;
            --text-secondary: #64748b;
            --success: #16a34a;
            --success-bg: #f0fdf4;
            --error: #dc2626;
            --error-bg: #fef2f2;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
        }

        .header h1 {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .block-tag {
            display: inline-block;
            background: #eff6ff;
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .chat-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
        }

        .message {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.4;
            max-width: 85%;
        }

        .message.vendedor {
            background: #e0f2fe;
            color: #0369a1;
            align-self: flex-start;
        }

        .message.cliente {
            background: #f1f5f9;
            color: #334155;
            align-self: flex-end;
            border: 1px solid var(--border);
        }

        .question {
            font-weight: 600;
            font-size: 1.05rem;
            margin-top: 10px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            text-align: left;
            font-size: 0.95rem;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #f0f7ff;
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .feedback {
            display: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .feedback.correct {
            display: block;
            background-color: var(--success-bg);
            color: var(--success);
            border: 1px solid #bbf7d0;
        }

        .feedback.incorrect {
            display: block;
            background-color: var(--error-bg);
            color: var(--error);
            border: 1px solid #fecaca;
        }

        .feedback-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
        }

        .btn-next {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            display: none;
        }

        .btn-next:hover {
            background-color: var(--primary-hover);
        }

        .results {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .results h2 {
            font-size: 1.8rem;
            color: var(--text);
            margin-bottom: 10px;
        }

        .score-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary);
            margin: 15px 0;
        }

        .btn-restart {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Simulador de Ventas y Atención al Cliente</h1>
        <p id="question-tracker" style="color: var(--text-secondary); font-size: 0.9rem;">Caso 1 de 13</p>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>

    <div id="quiz-screen">
        <span class="block-tag" id="block-tag">Bloque 1</span>
        
        <div class="chat-box" id="chat-box">
            </div>

        <p class="question" id="question-text">¿Cuál debe ser el siguiente paso o respuesta lógica adecuada?</p>

        <div class="options" id="options-container">
            </div>

        <div class="feedback" id="feedback-box">
            <div class="feedback-title" id="feedback-title"></div>
            <div id="feedback-text"></div>
        </div>

        <div class="actions">
            <button class="btn-next" id="btn-next" onclick="nextQuestion()">Siguiente Caso</button>
        </div>
    </div>

    <div class="results" id="results-screen">
        <h2>Entrenamiento Finalizado</h2>
        <p style="color: var(--text-secondary);">Has completado la evaluación de casos de atención al cliente y ventas.</p>
        <div class="score-display" id="score-display">0 / 13</div>
        <p id="score-comment" style="margin-bottom: 20px; color: var(--text);"></p>
        <button class="btn-restart" onclick="restartQuiz()">Reiniciar Simulador</button>
    </div>
</div>

        explanation: "<b>¿Por qué es la opción correcta?</b><br>Mantiene el flujo de la venta ágil. La pregunta de control encauza la conversación directo al cierre resolviendo la duda inicial del cliente."
    },
    {
        block: "Bloque 5: Cierre de Ventas y Seguimiento Post-Venta",
        title: "Caso 13: Cierre por escasez de inventario",
        dialogue: [
            { sender: "vendedor", text: "Entiendo perfectamente. Solo te comento que de esta edición especial solo nos quedan 2 unidades disponibles en bodega y el precio promocional vence hoy a medianoche. Si deseas, te separo la unidad con una reserva mínima para que no pierdas la oferta. ¿Te gustaría asegurarlo?" },
            { sender: "cliente", text: "Mmm, la verdad prefiero asumir el riesgo de que se agote. No me gusta tomar decisiones presionado por el tiempo." },
            { sender: "vendedor", text: "Lo comprendo y respeto completamente tu proceso. Te dejaré el catálogo guardado por si te decides a hacer la compra en otro momento." },

let currentQuestion = 0;
let score = 0;

const questionTracker = document.getElementById('question-tracker');
const progressFill = document.getElementById('progress-fill');
const blockTag = document.getElementById('block-tag');
const chatBox = document.getElementById('chat-box');
const questionText = document.getElementById('question-text');
const optionsContainer = document.getElementById('options-container');
const feedbackBox = document.getElementById('feedback-box');
const feedbackTitle = document.getElementById('feedback-title');
const feedbackText = document.getElementById('feedback-text');
const btnNext = document.getElementById('btn-next');
const quizScreen = document.getElementById('quiz-screen');
const resultsScreen = document.getElementById('results-screen');
const scoreDisplay = document.getElementById('score-display');
const scoreComment = document.getElementById('score-comment');

function loadQuestion() {
    const data = quizData[currentQuestion];

    // Resetear UI
    feedbackBox.className = 'feedback';
    feedbackBox.style.display = 'none';
    btnNext.style.display = 'none';
    optionsContainer.innerHTML = '';
    chatBox.innerHTML = '';

    // Actualizar progreso
    questionTracker.innerText = `Caso ${currentQuestion + 1} de ${quizData.length}`;
    progressFill.style.width = `${((currentQuestion + 1) / quizData.length) * 100}%`;
    blockTag.innerText = data.block;

    // Cargar Diálogo
    data.dialogue.forEach(msg => {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${msg.sender}`;
        msgDiv.innerText = `${msg.sender === 'vendedor' ? 'Vendedor' : 'Cliente'}: ${msg.text}`;
        chatBox.appendChild(msgDiv);
    });

    questionText.innerText = data.question;

    // Cargar Opciones
    data.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt.text;
        btn.onclick = () => selectOption(index);
        optionsContainer.appendChild(btn);
    });

    chatBox.scrollTop = chatBox.scrollHeight;
}

function selectOption(index) {
    const data = quizData[currentQuestion];
    const selectedOption = data.options[index];
    const buttons = optionsContainer.getElementsByClassName('option-btn');

    // Deshabilitar todos los botones
    for (let btn of buttons) {
        btn.disabled = true;
    }

    if (selectedOption.correct) {
        score++;
        buttons[index].style.borderColor = 'var(--success)';
        buttons[index].style.backgroundColor = 'var(--success-bg)';
        feedbackBox.className = 'feedback correct';
        feedbackTitle.innerText = '¡Respuesta Correcta!';
    } else {
        buttons[index].style.borderColor = 'var(--error)';
        buttons[index].style.backgroundColor = 'var(--error-bg)';
        feedbackBox.className = 'feedback incorrect';
        feedbackTitle.innerText = 'Respuesta Incorrecta';

        // Resaltar la respuesta correcta
        data.options.forEach((opt, idx) => {
            if (opt.correct) {
                buttons[idx].style.borderColor = 'var(--success)';
                buttons[idx].style.backgroundColor = 'var(--success-bg)';
            }
        });
    }

    feedbackText.innerHTML = data.explanation;
    btnNext.style.display = 'block';
}

function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < quizData.length) {
        loadQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    quizScreen.style.display = 'none';
    resultsScreen.style.display = 'block';
    scoreDisplay.innerText = `${score} / ${quizData.length}`;

    let percentage = (score / quizData.length) * 100;
    if (percentage >= 80) {
        scoreComment.innerText = '¡Excelente nivel! Dominas la psicología del cliente, el manejo de objeciones y la estructura de conversación.';
    } else if (percentage >= 50) {
        scoreComment.innerText = 'Buen trabajo. Tienes bases sólidas, pero conviene revisar el manejo de la presión y la empatía en casos complejos.';
    } else {
        scoreComment.innerText = 'Se sugiere revisar nuevamente los principios de validación, reencuadre y reducción del riesgo para mejorar los resultados.';
    }
}

function restartQuiz() {
    currentQuestion = 0;
    score = 0;
    resultsScreen.style.display = 'none';
    quizScreen.style.display = 'block';
    loadQuestion();
}

// Inicializar el simulador al cargar la página
loadQuestion();
</script>
