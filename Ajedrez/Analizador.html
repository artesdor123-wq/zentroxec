<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Analizador de Ajedrez - Piezas Colgadas</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      display: flex;
      gap: 20px;
      padding: 20px;
      background-color: #1e1e24;
      color: #ffffff;
      margin: 0;
    }
    
    .game-container {
      flex: 2;
      height: 90vh;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .panel {
      flex: 1;
      background-color: #2b2d42;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
    }

    h2 {
      margin-top: 0;
      color: #edf2f4;
      border-bottom: 2px solid #8d99ae;
      padding-bottom: 10px;
    }

    .status-box {
      background: #3d405b;
      padding: 10px;
      border-radius: 5px;
      font-size: 0.9em;
      margin-bottom: 15px;
      color: #81b29a;
    }

    ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
      flex-grow: 1;
      overflow-y: auto;
    }

    li {
      background: #2b2d42;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      border-left: 4px solid #8d99ae;
      font-size: 0.95em;
    }

    li.colgada {
      background: #3a232e;
      border-left-color: #e63946;
      color: #ffb4a2;
      font-weight: bold;
    }

    button {
      background-color: #e63946;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>

  <!-- Carga de Chess.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>

  <div class="game-container">
    <iframe id="game-frame" src="ajedrezN3.html"></iframe>
  </div>

  <div class="panel">
    <h2>Piezas Colgadas</h2>
    <div class="status-box" id="status">Buscando enlace con ajedrezN3.html...</div>
    
    <ul id="lista-colgadas">
      <li>Iniciando escaneo...</li>
    </ul>

    <button onclick="escanearTablero()">Escanear Ahora</button>
  </div>

  <script>
    const nombresPiezas = {
      'p': 'Peón', 'n': 'Caballo', 'b': 'Alfil',
      'r': 'Torre', 'q': 'Dama', 'k': 'Rey'
    };

    function obtenerFEN() {
      const iframe = document.getElementById('game-frame');
      
      try {
        const iframeWindow = iframe.contentWindow;

        // Intentar obtener el FEN desde las estructuras habituales de ajedrezN3.html
        if (iframeWindow.game && typeof iframeWindow.game.fen === 'function') {
          return iframeWindow.game.fen();
        }
        if (iframeWindow.board && typeof iframeWindow.board.fen === 'function') {
          return iframeWindow.board.fen();
        }
        if (iframeWindow.fen) {
          return typeof iframeWindow.fen === 'function' ? iframeWindow.fen() : iframeWindow.fen;
        }
      } catch (e) {
        console.error("Error al acceder al iframe:", e);
      }

      return null;
    }

    function escanearTablero() {
      let rawFen = obtenerFEN();
      const statusDiv = document.getElementById('status');
      const listaUI = document.getElementById('lista-colgadas');

      if (!rawFen) {
        statusDiv.innerText = "Error: No se pudo leer la posición de ajedrezN3.html";
        listaUI.innerHTML = '<li>Esperando lectura del tablero...</li>';
        return;
      }

      // Normalizar el FEN: si no contiene datos de turno/enroque, añadírselos.
      let fenCompleto = rawFen;
      if (rawFen.split(' ').length === 1) {
        fenCompleto = rawFen + ' w - - 0 1';
      }

      statusDiv.innerText = "Conectado. Analizando casillas...";

      const colgadas = [];

      // Probar analisis para Blancas y Negras de forma explícita
      ['w', 'b'].forEach(turnoForzado => {
        const partes = fenCompleto.split(' ');
        partes[1] = turnoForzado; // Forzamos el turno para verificar amenazas de ambos bandos
        const fenProcesar = partes.join(' ');

        let game;
        try {
          game = new Chess(fenProcesar);
        } catch (err) {
          return;
        }

        game.SQUARES.forEach(casilla => {
          const pieza = game.get(casilla);
          if (pieza && pieza.color === turnoForzado) {
            const colorRival = pieza.color === 'w' ? 'b' : 'w';

            // Evaluar si la casilla está atacada por el enemigo y sin defensa aliada
            const atacadaPorRival = game.isAttacked(casilla, colorRival);
            const defendidaPorAliados = game.isAttacked(casilla, pieza.color);

            if (atacadaPorRival && !defendidaPorAliados) {
              const colorTxt = pieza.color === 'w' ? 'Blanca' : 'Negra';
              const textoDetectado = `${nombresPiezas[pieza.type]} ${colorTxt} en ${casilla.toUpperCase()}`;
              
              if (!colgadas.includes(textoDetectado)) {
                colgadas.push(textoDetectado);
              }
            }
          }
        });
      });

      // Renderizar resultado final
      if (colgadas.length === 0) {
        listaUI.innerHTML = '<li>✅ No hay ninguna pieza colgada en el tablero.</li>';
      } else {
        listaUI.innerHTML = colgadas.map(item => `<li class="colgada">🚨 ${item}</li>`).join('');
      }
    }

    // Escaneo continuo cada 1 segundo
    setInterval(escanearTablero, 1000);
    document.getElementById('game-frame').onload = escanearTablero;
  </script>

</body>
</html>
