<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Analizador de Ajedrez - Piezas Colgadas</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      display: flex;
      gap: 20px;
      padding: 20px;
      background-color: #1e1e24;
      color: #ffffff;
      margin: 0;
    }
    
    /* Contenedor del juego original */
    .game-container {
      flex: 2;
      height: 90vh;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Panel lateral de análisis */
    .panel {
      flex: 1;
      background-color: #2b2d42;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
    }

    h2 {
      margin-top: 0;
      color: #edf2f4;
      border-bottom: 2px solid #8d99ae;
      padding-bottom: 10px;
    }

    .status-box {
      background: #3d405b;
      padding: 10px;
      border-radius: 5px;
      font-size: 0.9em;
      margin-bottom: 15px;
      color: #81b29a;
    }

    ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
      flex-grow: 1;
      overflow-y: auto;
    }

    li {
      background: #2b2d42;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      border-left: 4px solid #8d99ae;
      font-size: 0.95em;
    }

    li.colgada {
      background: #3a232e;
      border-left-color: #e63946;
      color: #ffb4a2;
      font-weight: bold;
    }

    button {
      background-color: #e63946;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #d62828;
    }
  </style>

  <!-- Carga de Chess.js para procesar la lógica del ajedrez -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>

  <!-- Marco donde se muestra tu juego ajedrezN3.html enlazado -->
  <div class="game-container">
    <iframe id="game-frame" src="ajedrezN3.html"></iframe>
  </div>

  <!-- Panel que muestra las piezas colgadas detectadas -->
  <div class="panel">
    <h2>Piezas Colgadas</h2>
    <div class="status-box" id="status">Enlazado con ajedrezN3.html...</div>
    
    <ul id="lista-colgadas">
      <li>Iniciando escaneo...</li>
    </ul>

    <button onclick="escanearTablero()">Escanear Ahora</button>
  </div>

  <script>
    const nombresPiezas = {
      'p': 'Peón', 'n': 'Caballo', 'b': 'Alfil',
      'r': 'Torre', 'q': 'Dama', 'k': 'Rey'
    };

    // Función para obtener la posición FEN directamente de ajedrezN3.html
    function obtenerFEN() {
      const iframe = document.getElementById('game-frame');
      
      try {
        const iframeWindow = iframe.contentWindow;

        // 1. Si ajedrezN3.html tiene una variable de objeto 'game' (ej: Chess.js)
        if (iframeWindow.game && typeof iframeWindow.game.fen === 'function') {
          return iframeWindow.game.fen();
        }
        
        // 2. Si ajedrezN3.html tiene una variable global llamada 'fen'
        if (iframeWindow.fen && typeof iframeWindow.fen === 'string') {
          return iframeWindow.fen;
        }

        // 3. Si ajedrezN3.html usa Chessboard.js y tiene un objeto 'board'
        if (iframeWindow.board && typeof iframeWindow.board.fen === 'function') {
          return iframeWindow.board.fen();
        }
      } catch (e) {
        console.error("Error al acceder al iframe:", e);
      }

      return null;
    }

    // Función principal de análisis
    function escanearTablero() {
      const fen = obtenerFEN();
      const statusDiv = document.getElementById('status');
      const listaUI = document.getElementById('lista-colgadas');

      if (!fen) {
        statusDiv.innerText = "Esperando que se cargue la partida en ajedrezN3.html...";
        listaUI.innerHTML = '<li>Buscando estado del tablero...</li>';
        return;
      }

      statusDiv.innerText = "Conectado. Leyendo posición actual.";

      // Crear instancia de chess.js para calcular ataques/defensas
      const game = new Chess(fen);
      const colgadas = [];

      game.SQUARES.forEach(casilla => {
        const pieza = game.get(casilla);
        if (pieza) {
          const colorPieza = pieza.color;
          const colorRival = colorPieza === 'w' ? 'b' : 'w';

          const atacadaPorRival = game.isAttacked(casilla, colorRival);
          const defendidaPorAliados = game.isAttacked(casilla, colorPieza);

          // Si el enemigo la ataca y ningún aliado la defiende = Colgada
          if (atacadaPorRival && !defendidaPorAliados) {
            const colorTxt = colorPieza === 'w' ? 'Blanca' : 'Negra';
            colgadas.push(`${nombresPiezas[pieza.type]} ${colorTxt} en **${casilla.toUpperCase()}**`);
          }
        }
      });

      // Renderizar resultado
      if (colgadas.length === 0) {
        listaUI.innerHTML = '<li>✅ No hay ninguna pieza colgada en el tablero.</li>';
      } else {
        listaUI.innerHTML = colgadas.map(item => `<li class="colgada">🚨 ${item}</li>`).join('');
      }
    }

    // Escanear automáticamente cada 1 segundo para detectar movimientos en tiempo real
    setInterval(escanearTablero, 1000);

    // Escaneo inicial tras cargar el iframe
    document.getElementById('game-frame').onload = escanearTablero;
  </script>

</body>
</html>
