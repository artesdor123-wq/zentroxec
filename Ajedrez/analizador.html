<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Analizador de Piezas Colgadas - Ajedrez</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      gap: 20px;
      padding: 20px;
      background-color: #1e272e;
      color: #d2dae2;
      margin: 0;
      height: 100vh;
    }
    
    .game-container {
      flex: 2;
      height: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .panel {
      flex: 1;
      max-width: 400px;
      background-color: #2c3a47;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
    }

    h2 {
      margin-top: 0;
      color: #00d2d3;
      border-bottom: 1px solid #485460;
      padding-bottom: 10px;
    }

    .status-box {
      background: #1e272e;
      padding: 10px;
      border-radius: 4px;
      font-size: 0.9em;
      margin-bottom: 15px;
      color: #20bf6b;
      border: 1px solid #485460;
    }

    ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
      flex-grow: 1;
      overflow-y: auto;
    }

    li {
      background: #1e272e;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      border-left: 4px solid #485460;
      font-size: 0.95em;
    }

    li.colgada {
      background: #3d1e22;
      border-left-color: #eb3b5a;
      color: #ffdae0;
      font-weight: bold;
    }

    button {
      background-color: #546de5;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #778ca3;
    }
  </style>

  <!-- Librería auxiliar para evaluar ataques tácticos sobre el FEN extraído -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>

  <!-- Cargamos tu ajedrezN3.html dentro de la ventana -->
  <div class="game-container">
    <iframe id="game-frame" src="ajedrezN3.html"></iframe>
  </div>

  <!-- Panel lateral donde se mostrarán los alertas de piezas colgadas -->
  <div class="panel">
    <h2>Piezas Colgadas</h2>
    <div class="status-box" id="status">Enlazando con ajedrezN3.html...</div>
    
    <ul id="lista-colgadas">
      <li>Esperando carga del juego...</li>
    </ul>

    <button onclick="escanearTablero()">Escanear Manualmente</button>
  </div>

  <script>
    const nombresPiezas = {
      'p': 'Peón', 'n': 'Caballo', 'b': 'Alfil',
      'r': 'Torre', 'q': 'Dama', 'k': 'Rey'
    };

    // Extrae el FEN directamente desde tu objeto global 'chess' en ajedrezN3.html
    function obtenerFEN() {
      const iframe = document.getElementById('game-frame');
      
      try {
        const iframeWin = iframe.contentWindow;

        // Acceso directo a tu instancia de ChessEngine llamada 'chess'
        if (iframeWin.chess && typeof iframeWin.chess.generateFEN === 'function') {
          return iframeWin.chess.generateFEN();
        }

        // Fallback: leer del input FEN de la interfaz
        const inputFen = iframeWin.document.getElementById('fen-input');
        if (inputFen && inputFen.value) {
          return inputFen.value;
        }
      } catch (e) {
        console.error("Error leyendo iframe:", e);
      }

      return null;
    }

    function escanearTablero() {
      const statusDiv = document.getElementById('status');
      const listaUI = document.getElementById('lista-colgadas');
      let rawFen = obtenerFEN();

      if (!rawFen) {
        statusDiv.innerText = "Buscando partida activa...";
        return;
      }

      statusDiv.innerText = "Conectado a chess.generateFEN()";

      const colgadas = [];

      // Analizamos ambos bandos ('w' y 'b') para capturar cualquier pieza indefensa atacada
      ['w', 'b'].forEach(colorEvaluar => {
        const partes = rawFen.split(' ');
        partes[1] = colorEvaluar; 
        const fenProcesar = partes.join(' ');

        let game;
        try {
          game = new Chess(fenProcesar);
        } catch (err) {
          return;
        }

        game.SQUARES.forEach(casilla => {
          const pieza = game.get(casilla);
          if (pieza && pieza.color === colorEvaluar) {
            const colorRival = pieza.color === 'w' ? 'b' : 'w';

            // Evalúa si la casilla la ataca el rival y si NO la defiende su propio bando
            const atacadaPorRival = game.isAttacked(casilla, colorRival);
            const defendidaPorAliados = game.isAttacked(casilla, pieza.color);

            if (atacadaPorRival && !defendidaPorAliados) {
              const colorTxt = pieza.color === 'w' ? 'Blanca' : 'Negra';
              const alerta = `${nombresPiezas[pieza.type]} ${colorTxt} en ${casilla.toUpperCase()}`;
              
              if (!colgadas.includes(alerta)) {
                colgadas.push(alerta);
              }
            }
          }
        });
      });

      // Muestra resultados en pantalla
      if (colgadas.length === 0) {
        listaUI.innerHTML = '<li>✅ Ninguna pieza está colgada.</li>';
      } else {
        listaUI.innerHTML = colgadas.map(item => `<li class="colgada">🚨 ${item}</li>`).join('');
      }
    }

    // Escaneo constante cada 500ms para reflejar jugadas o ejercicios inmediatamente
    setInterval(escanearTablero, 500);

    // Escaneo inicial cuando el iframe termina de cargar
    document.getElementById('game-frame').onload = escanearTablero;
  </script>

</body>
</html>
