<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Cuaderno de Vocabulario 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Literata:ital,opsz,wght@0,18..144,400;0,18..144,600;1,18..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FAFAF7;
    --grid: #D7E3EC;
    --margin: #E3A6A0;
    --ink: #202B3A;
    --ink-soft: #64707F;
    --ink-faint: #97A1AC;
    --accent: #2C6E5D;
    --accent-dark: #1E5548;
    --accent-soft: #E1EFEA;
    --highlight: #F6D879;
    --card-line: #E3DFD3;
    --radius: 3px;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0; padding:0;
    background:
      linear-gradient(90deg, transparent 46px, var(--margin) 46px, var(--margin) 48px, transparent 48px),
      repeating-linear-gradient(var(--paper) 0px, var(--paper) 31px, var(--grid) 32px);
    background-color: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
  }

  body{ display:flex; justify-content:center; }

  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    padding: 18px 20px 40px 56px;
    display:flex;
    flex-direction:column;
  }

  .brand{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:6px;
  }
  .brand h1{ font-family:'Kalam', cursive; font-size:22px; font-weight:700; margin:0; color:var(--ink); }
  .brand .part{ font-size:12px; color:var(--ink-faint); font-weight:500; }

  .progress-wrap{ margin: 10px 0 20px; }
  .progress-label{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); margin-bottom:6px; }
  .progress-bar{ height:6px; background: var(--card-line); border-radius:6px; overflow:hidden; }
  .progress-fill{ height:100%; background: var(--accent); border-radius:6px; transition: width .35s ease; }

  .card{
    background: var(--paper);
    border: 1px solid var(--card-line);
    border-radius: var(--radius);
    padding: 22px 20px;
    flex:1;
    display:flex;
    flex-direction:column;
    animation: fadeIn .3s ease;
  }
  @keyframes fadeIn{ from{ opacity:0; transform: translateY(6px); } to{ opacity:1; transform: translateY(0); } }

  .step-kicker{
    font-size:11px; letter-spacing:.02em; color: var(--accent-dark);
    background: var(--accent-soft); display:inline-block; padding: 3px 9px;
    border-radius: 20px; margin-bottom: 16px; width:fit-content; font-weight:600;
  }

  .word-title{ font-family:'Kalam', cursive; font-size:38px; font-weight:700; color: var(--ink); line-height:1.05; margin: 0 0 4px; }
  .group-title{ font-family:'Kalam', cursive; font-size:26px; font-weight:700; margin: 0 0 4px; }
  .field-label{ font-size:12px; color:var(--ink-soft); margin: 18px 0 8px; font-weight:600; }
  .meaning-text{ font-family:'Literata', serif; font-size:19px; line-height:1.5; color: var(--ink); margin: 2px 0 0; }
  .sentence-flow{ font-family:'Literata', serif; font-size:18px; line-height:1.85; color: var(--ink); }

  .blank-input{
    font-family:'Literata', serif; font-size:18px; font-style:italic; color: var(--accent-dark);
    background: var(--accent-soft); border: none; border-bottom: 2px solid var(--accent);
    border-radius: 2px; padding: 1px 6px; min-width: 90px; width: auto; outline:none;
  }
  .blank-input:focus{ background:#fff; }

  textarea.own-sentence{
    font-family:'Literata', serif; font-size:17px; line-height:1.6; color: var(--ink);
    background: transparent; border:none; border-bottom: 2px solid var(--card-line);
    padding: 6px 2px; resize:none; outline:none; width:100%; min-height: 70px;
  }
  textarea.own-sentence:focus{ border-bottom-color: var(--accent); }

  .word-bank{ display:flex; flex-wrap:wrap; gap:6px; margin-top:18px; }
  .chip{ font-size:13px; background: var(--accent-soft); color: var(--accent-dark); padding:4px 10px; border-radius: 20px; font-weight:500; }

  .spacer{ flex:1; }
  .nav-row{ display:flex; gap:10px; margin-top: 24px; }

  button{ font-family:'Inter', sans-serif; font-size:15px; font-weight:600; border-radius: var(--radius); border: none; padding: 13px 18px; cursor:pointer; }
  .btn-primary{ background: var(--accent); color:#fff; flex:1; }
  .btn-primary:active{ background: var(--accent-dark); }
  .btn-ghost{ background: transparent; color: var(--ink-soft); border: 1px solid var(--card-line); }

  .home{ flex:1; display:flex; flex-direction:column; justify-content:center; text-align:left; }
  .home h1{ font-family:'Kalam', cursive; font-size:40px; margin:0 0 6px; line-height:1.05; }
  .home p{ font-family:'Literata', serif; font-size:16px; color: var(--ink-soft); line-height:1.5; max-width: 34ch; }
  .home-stat{ margin: 18px 0; font-size:14px; color: var(--ink-soft); }
  .home-stat strong{ color:var(--ink); }

  .link-btn{ background:none; border:none; color: var(--accent-dark); font-weight:600; font-size:14px; text-decoration: underline; padding: 10px 0; text-align:left; cursor:pointer; }

  .overview-grid{ display:grid; grid-template-columns: repeat(6, 1fr); gap:8px; margin: 14px 0 20px; overflow-y:auto; }
  .g-dot{ aspect-ratio:1; border-radius:6px; border:1px solid var(--card-line); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color: var(--ink-soft); background: var(--paper); cursor:pointer; }
  .g-dot.done{ background: var(--accent); color:#fff; border-color:var(--accent); }
  .g-dot.current{ border: 2px solid var(--accent-dark); color:var(--accent-dark); }

  .done-screen{ flex:1; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; }
  .done-screen h1{ font-family:'Kalam', cursive; font-size:34px; margin:0 0 10px; }
  .done-screen p{ font-family:'Literata', serif; font-size:16px; color:var(--ink-soft); line-height:1.5; }

  /* motivational stimulus */
  .motiv-hero{
    width:100%;
    border-radius: var(--radius);
    overflow:hidden;
    border: 1px solid var(--card-line);
    margin-bottom: 16px;
  }
  .motiv-hero img{ width:100%; display:block; }
  .motiv-caption{
    font-family:'Kalam', cursive;
    font-size: 15px;
    color: var(--ink-soft);
    padding: 8px 2px 0;
  }

  .motiv-screen{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  }
  .motiv-screen img{
    width: 78%;
    max-width: 300px;
    border-radius: var(--radius);
    border: 1px solid var(--card-line);
    margin-bottom: 18px;
  }
  .motiv-screen .motiv-kicker{
    font-size:11px; letter-spacing:.02em; color: var(--accent-dark);
    background: var(--accent-soft); padding: 3px 9px; border-radius: 20px; margin-bottom: 14px; font-weight:600;
  }
  .motiv-screen h2{
    font-family:'Kalam', cursive; font-size:26px; margin: 0 0 8px; line-height:1.15; max-width: 26ch;
  }
  .motiv-screen p{
    font-family:'Literata', serif; font-size:15px; color: var(--ink-soft); max-width: 30ch; line-height:1.5;
  }

  ::selection{ background: var(--highlight); }
</style>
</head>

<script id="data-json" type="application/json">[{"group":91,"words":[{"word":"Aplicación","meaning":"puesta en práctica de un conocimiento","sentence":"La ________ práctica del conocimiento revela vacíos que la teoría no muestra."},{"word":"Resumen","meaning":"versión breve de un contenido","sentence":"Un buen ________ conserva la idea central sin perder el sentido original."},{"word":"Esquema","meaning":"representación simplificada de ideas","sentence":"Organizar la información en un ________ facilita repasar todo el contenido rápidamente."},{"word":"Análisis","meaning":"examen detallado de algo","sentence":"Todo ________ serio parte de datos verificados, no de simples suposiciones."},{"word":"Pensamiento","meaning":"proceso mental de razonar","sentence":"Un ________ crítico cuestiona la información antes de aceptarla como cierta."}],"paragraph_num":91,"paragraph_words":["aplicación","resumen","esquema","análisis","pensamiento"],"paragraph_text":"El aprendizaje verdadero ocurre cuando la práctica constante se une a la curiosidad. Entre los elementos que resaltan en esta escena están ________, ________ y ________, junto con ________ y ________, aunque, así el conocimiento se afirma con cada repaso."},{"group":92,"words":[{"word":"Autoaprendizaje","meaning":"aprendizaje por cuenta propia","sentence":"El ________ exige más disciplina que estudiar dentro de un aula tradicional."},{"word":"Ahorro","meaning":"dinero guardado para el futuro","sentence":"El ________ mensual, por pequeño que sea, se acumula con el paso del tiempo."},{"word":"Inversión","meaning":"destinar dinero para obtener ganancias","sentence":"Toda ________ conlleva cierto riesgo que debe entenderse antes de comprometer el dinero."},{"word":"Ingreso","meaning":"dinero que se recibe","sentence":"Un ________ adicional ayuda a alcanzar metas financieras con mayor rapidez."},{"word":"Gasto","meaning":"dinero que se desembolsa","sentence":"Registrar cada ________ permite detectar fugas de dinero que antes pasaban inadvertidas."}],"paragraph_num":92,"paragraph_words":["autoaprendizaje","ahorro","inversión","ingreso","gasto"],"paragraph_text":"Al manejar las finanzas personales, conviene llevar un control claro del dinero. Entre los elementos que se mencionan en esta escena están ________, ________ y ________, además de ________ y ________, siempre que, y con eso se evita caer en deudas innecesarias."},{"group":93,"words":[{"word":"Patrimonio","meaning":"conjunto de bienes de una persona","sentence":"El ________ familiar creció gracias a decisiones financieras sostenidas durante años."},{"word":"Pasivo","meaning":"deuda u obligación económica","sentence":"Un ________ genera un gasto constante, a diferencia de un activo que produce ingresos."},{"word":"Riqueza","meaning":"abundancia de bienes","sentence":"La ________ real no se mide únicamente por el dinero disponible en el momento."},{"word":"Deuda","meaning":"dinero que se debe","sentence":"Una ________ bien administrada puede impulsar un negocio en lugar de hundirlo."},{"word":"Crédito","meaning":"dinero prestado para pagar después","sentence":"Solicitar un ________ exige evaluar previamente la capacidad real de pago."}],"paragraph_num":93,"paragraph_words":["patrimonio","pasivo","riqueza","deuda","crédito"],"paragraph_text":"En la economía de cualquier hogar, el equilibrio entre ingreso y gasto es vital. Entre los elementos que sobresalen en esta escena están ________, ________ y ________, sin dejar de lado ________ y ________, enseguida, esto ayuda a construir un patrimonio más sólido con el tiempo."},{"group":94,"words":[{"word":"Préstamo","meaning":"dinero entregado con obligación de devolverlo","sentence":"El ________ se destinó por completo a ampliar el inventario del negocio."},{"word":"Moneda","meaning":"unidad monetaria de un país","sentence":"El valor de la ________ local se debilitó frente al dólar durante el último trimestre."},{"word":"Inflación","meaning":"aumento generalizado de precios","sentence":"La ________ reduce el poder adquisitivo incluso cuando el ingreso se mantiene igual."},{"word":"Economía","meaning":"sistema de producción e intercambio de bienes","sentence":"La ________ del país depende, en gran parte, de sus exportaciones."},{"word":"Empleo","meaning":"actividad laboral remunerada","sentence":"Conseguir un ________ estable sigue siendo la meta de muchas familias."}],"paragraph_num":94,"paragraph_words":["préstamo","moneda","inflación","economía","empleo"],"paragraph_text":"Cuando se piensa en el dinero a largo plazo, el ahorro se vuelve prioridad. Entre los elementos que conviven en esta escena están ________, ________ y ________, acompañados de ________ y ________, en resumen, y de esa manera el dinero rinde mejor a largo plazo."},{"group":95,"words":[{"word":"Oficio","meaning":"trabajo manual especializado","sentence":"Aprender un ________ útil garantiza ingresos incluso en tiempos económicos difíciles."},{"word":"Profesión","meaning":"actividad laboral que requiere formación","sentence":"Elegir una ________ debe combinar tanto el interés personal como la demanda del mercado."},{"word":"Jornada","meaning":"periodo diario de trabajo","sentence":"Una ________ de trabajo bien organizada rinde más que una jornada extensa pero desordenada."},{"word":"Productividad","meaning":"cantidad de resultado obtenido por esfuerzo","sentence":"La ________ mejora cuando se eliminan tareas que no aportan valor real."},{"word":"Desempeño","meaning":"rendimiento en una actividad","sentence":"El ________ del equipo se evalúa con base en resultados concretos, no en horas trabajadas."}],"paragraph_num":95,"paragraph_words":["oficio","profesión","jornada","productividad","desempeño"],"paragraph_text":"El ambiente de trabajo mejora cuando el equipo colabora con confianza. Entre los elementos que figuran en esta escena están ________, ________ y ________, de la mano de ________ y ________, específicamente, un paso más dentro de una trayectoria profesional sólida."},{"group":96,"words":[{"word":"Equipo","meaning":"grupo de personas que trabaja unido","sentence":"Un ________ bien coordinado logra más que la suma de sus talentos individuales."},{"word":"Liderazgo","meaning":"capacidad de dirigir a otros","sentence":"El ________ efectivo inspira al equipo incluso en los momentos más complicados."},{"word":"Jerarquía","meaning":"orden de niveles de autoridad","sentence":"La ________ dentro de la empresa define claramente quién toma cada decisión."},{"word":"Capacitación","meaning":"formación para mejorar habilidades","sentence":"La ________ constante mantiene al personal actualizado frente a los cambios del mercado."},{"word":"Contrato","meaning":"acuerdo formal entre partes","sentence":"Todo ________ debe revisarse con cuidado antes de firmar cualquier acuerdo laboral."}],"paragraph_num":96,"paragraph_words":["equipo","liderazgo","jerarquía","capacitación","contrato"],"paragraph_text":"En el mundo laboral, cada logro pequeño acerca una meta más grande. Entre los elementos que resuenan en esta escena están ________, ________ y ________, junto con ________ y ________, en cuanto a, algo que cualquier persona responsable valora en su trabajo."},{"group":97,"words":[{"word":"Salario","meaning":"pago por trabajo realizado","sentence":"El ________ se depositó puntualmente, tal como establecía el contrato firmado."},{"word":"Ascenso","meaning":"subida a un puesto superior","sentence":"El ________ llegó después de dos años de resultados constantes dentro del equipo."},{"word":"Carrera","meaning":"trayectoria profesional","sentence":"Construir una ________ sólida requiere paciencia, ya que los resultados rara vez son inmediatos."},{"word":"Oficina","meaning":"lugar de trabajo administrativo","sentence":"La ________ se reorganizó para fomentar un trabajo más colaborativo entre las áreas."},{"word":"Colega","meaning":"compañero de trabajo","sentence":"Un ________ dispuesto a ayudar hace que cualquier proyecto avance con mayor fluidez."}],"paragraph_num":97,"paragraph_words":["salario","ascenso","carrera","oficina","colega"],"paragraph_text":"En cualquier trabajo, cumplir con responsabilidad cada tarea construye una buena reputación. Entre los elementos que destacan en esta escena están ________, ________ y ________, además de ________ y ________, es decir, así el trabajo diario rinde mejores resultados para todo el equipo."},{"group":98,"words":[{"word":"Vacante","meaning":"puesto de trabajo disponible","sentence":"La ________ se cubrió rápido gracias a una convocatoria bien difundida."},{"word":"Currículum","meaning":"resumen de la trayectoria profesional","sentence":"Un ________ claro y directo destaca más que uno cargado de información innecesaria."},{"word":"Cultura","meaning":"conjunto de valores y costumbres de un grupo","sentence":"La ________ de una empresa se nota más en cómo actúa que en lo que declara."},{"word":"Transformador","meaning":"arquitectura de red neuronal para lenguaje","sentence":"El modelo ________ procesa el texto completo en lugar de analizarlo palabra por palabra."},{"word":"Alucinación","meaning":"respuesta incorrecta generada por una IA","sentence":"Una ________ del modelo ocurre cuando genera información que suena correcta sin serlo."}],"paragraph_num":98,"paragraph_words":["vacante","currículum","cultura","transformador","alucinación"],"paragraph_text":"Dentro de una empresa, el desempeño de cada colega influye en el resultado del equipo. Entre los elementos que aparecen en esta escena están ________, ________ y ________, sin dejar de lado ________ y ________, en definitiva, y con eso la carrera profesional sigue avanzando paso a paso."},{"group":99,"words":[{"word":"Inferencia","meaning":"proceso de generar una respuesta con un modelo","sentence":"Durante la ________, el modelo aplica lo aprendido para responder a una consulta nueva."},{"word":"Parámetro","meaning":"valor interno ajustable de un modelo","sentence":"Cada ________ adicional aumenta la capacidad del modelo, aunque también su costo computacional."},{"word":"Arquitectura","meaning":"estructura de diseño de un sistema","sentence":"La ________ del modelo determina, en gran parte, su capacidad de comprender contexto."},{"word":"Token","meaning":"unidad mínima de texto procesada por un modelo","sentence":"El texto se divide en ________ antes de que el modelo pueda procesarlo internamente."},{"word":"Alineación","meaning":"ajuste de la IA a valores deseados","sentence":"La ________ del modelo busca que sus respuestas coincidan con los valores esperados."}],"paragraph_num":99,"paragraph_words":["inferencia","parámetro","arquitectura","token","alineación"],"paragraph_text":"Al diseñar un nuevo dispositivo, los ingenieros revisan cada componente con cuidado. Entre los elementos que resaltan en esta escena están ________, ________ y ________, acompañados de ________ y ________, desde luego, esto demuestra el ritmo acelerado de la tecnología actual."},{"group":100,"words":[{"word":"Superinteligencia","meaning":"inteligencia artificial que supera a la humana","sentence":"El debate sobre la ________ plantea preguntas que todavía no tienen respuesta clara."},{"word":"Software","meaning":"programas informáticos","sentence":"El ________ se actualizó automáticamente durante la madrugada, sin interrumpir el servicio."},{"word":"Hardware","meaning":"componentes físicos de un equipo","sentence":"Un ________ más potente permite entrenar modelos considerablemente más grandes."},{"word":"Dispositivo","meaning":"aparato electrónico","sentence":"Cada ________ conectado envía datos que luego se analizan en la nube."},{"word":"Plataforma","meaning":"entorno digital para servicios","sentence":"La ________ centraliza toda la información del negocio en un solo lugar."}],"paragraph_num":100,"paragraph_words":["superinteligencia","software","hardware","dispositivo","plataforma"],"paragraph_text":"En el área de tecnología, la infraestructura debe estar siempre lista para crecer. Entre los elementos que se mencionan en esta escena están ________, ________ y ________, de la mano de ________ y ________, posiblemente, y de esa manera el usuario final sale beneficiado."},{"group":101,"words":[{"word":"Nube","meaning":"almacenamiento en servidores remotos","sentence":"Almacenar los datos en la ________ facilita acceder a ellos desde cualquier ubicación."},{"word":"Ciberseguridad","meaning":"protección de sistemas digitales","sentence":"La ________ se reforzó después de detectar un intento de acceso no autorizado."},{"word":"Dato","meaning":"información registrada","sentence":"Cada ________ recopilado, si se analiza bien, revela un patrón útil para el negocio."},{"word":"Conectividad","meaning":"capacidad de conexión a redes","sentence":"La ________ estable resulta indispensable para cualquier operación en tiempo real."},{"word":"Innovación","meaning":"creación de algo nuevo","sentence":"La ________ constante mantiene a la empresa un paso adelante de la competencia."}],"paragraph_num":101,"paragraph_words":["nube","ciberseguridad","dato","conectividad","innovación"],"paragraph_text":"Cada nueva actualización tecnológica busca mejorar la experiencia del usuario. Entre los elementos que sobresalen en esta escena están ________, ________ y ________, junto con ________ y ________, frecuentemente, un paso más en la evolución constante de la tecnología."},{"group":102,"words":[{"word":"Actualización","meaning":"mejora de una versión existente","sentence":"La ________ corrigió varios errores que afectaban el rendimiento general."},{"word":"Interfaz","meaning":"punto de interacción entre usuario y sistema","sentence":"Una ________ sencilla reduce el tiempo que un usuario nuevo tarda en aprender el sistema."},{"word":"Usabilidad","meaning":"facilidad de uso de un sistema","sentence":"La ________ mejoró notablemente después de simplificar el proceso de compra."},{"word":"Infraestructura","meaning":"base física o técnica de un sistema","sentence":"La ________ tecnológica debe escalar al m _ permitió intercambiar tasas de interés entre ambas partes del acuerdo."},{"word":"Forward","meaning":"contrato a plazo entre dos partes","sentence":"El ________ fijó el tipo de cambio antes de que la divisa se devaluara."},{"word":"Commodity","meaning":"materia prima cotizada en el mercado","sentence":"El precio del ________ subió tras conocerse una posible escasez de oferta."},{"word":"Materia","meaning":"sustancia con la que se elabora algo","sentence":"La ________ prima representa uno de los mayores costos dentro de la producción."}],"paragraph_num":166,"paragraph_words":["derivado","swap","forward","commodity","materia"],"paragraph_text":"En las inversiones, diversificar el capital ayuda a reducir el riesgo general. Entre los elementos que conviven en esta escena están ________, ________ y ________, junto con ________ y ________, en fin, y de esa manera el capital se mueve con más criterio."},{"group":167,"words":[{"word":"Metal","meaning":"elemento sólido brillante y conductor","sentence":"El precio del ________ reaccionó de inmediato ante la noticia geopolítica."},{"word":"Petróleo","meaning":"combustible fósil líquido","sentence":"El precio del ________ influye directamente en el costo del transporte."},{"word":"Gas","meaning":"sustancia en estado gaseoso, combustible","sentence":"El ________ natural se convirtió en una alternativa más barata frente a otros combustibles."},{"word":"Plata","meaning":"metal precioso blanco","sentence":"La ________ suele considerarse un refugio, aunque más volátil que el oro."},{"word":"Acero","meaning":"aleación de hierro y carbono","sentence":"El precio del ________ afecta directamente el costo de cualquier construcción."}],"paragraph_num":167,"paragraph_words":["metal","petróleo","gas","plata","acero"],"paragraph_text":"Cada decisión de trading combina análisis, paciencia y control del riesgo. Entre los elementos que figuran en esta escena están ________, ________ y ________, además de ________ y ________, claramente, un paso más hacia una estrategia de inversión más sólida."},{"group":168,"words":[{"word":"Final","meaning":"parte última de algo","sentence":"En el ________ de la partida, cada movimiento del rey se vuelve decisivo."},{"word":"Medio","meaning":"parte intermedia de algo","sentence":"Durante el ________ juego, conviene coordinar las piezas antes de lanzar el ataque."},{"word":"Juego","meaning":"actividad recreativa con reglas","sentence":"Todo buen ________ combina planificación, cálculo y algo de intuición."},{"word":"Partida","meaning":"cada instancia de un juego","sentence":"La ________ se decidió en los últimos movimientos, tras un error del rival."},{"word":"Movimiento","meaning":"desplazamiento o jugada","sentence":"Un solo ________ mal calculado puede cambiar por completo el resultado final."}],"paragraph_num":168,"paragraph_words":["final","medio","juego","partida","movimiento"],"paragraph_text":"En el ajedrez de alto nivel, cada detalle en la posición puede definir la ________. Entre los elementos que resuenan en esta escena están ________, ________ y ________, sin dejar de lado partida y ________, seguramente, algo que todo buen jugador de ajedrez sabe reconocer a tiempo."},{"group":169,"words":[{"word":"Jugada","meaning":"acción realizada en un juego","sentence":"Una sola ________ arriesgada cambió por completo el rumbo de la partida."},{"word":"Ronda","meaning":"cada fase de una competencia","sentence":"El jugador avanzó a la siguiente ________ tras ganar dos partidas seguidas."},{"word":"Match","meaning":"enfrentamiento entre competidores","sentence":"El ________ se definió en el último minuto gracias a una jugada inesperada."},{"word":"Campeonato","meaning":"competencia que otorga un título","sentence":"El ________ reunió a competidores de distintos países durante todo el mes."},{"word":"Liga","meaning":"competencia organizada por temporadas","sentence":"La ________ se disputa en varias fases antes de definir al campeón final."}],"paragraph_num":169,"paragraph_words":["jugada","ronda","match","campeonato","liga"],"paragraph_text":"En una partida de ajedrez, cada movimiento se piensa con calma antes de tocar la pieza. Entre los elementos que destacan en esta escena están ________, ________ y ________, acompañados de ________ y ________, así, así se construye una ventaja que puede decidir la partida."},{"group":170,"words":[{"word":"Ranking","meaning":"clasificación por desempeño","sentence":"Su posición en el ________ mejoró después de una racha de victorias consecutivas."},{"word":"Puntuación","meaning":"número de puntos obtenidos","sentence":"La ________ final consideró tanto la velocidad como la precisión de cada jugada."},{"word":"Victoria","meaning":"resultado de ganar","sentence":"La ________ se celebró como el resultado de meses de práctica constante."},{"word":"Derrota","meaning":"resultado de perder","sentence":"Una ________, analizada con calma, suele enseñar más que una victoria fácil."},{"word":"Empate","meaning":"resultado igualado","sentence":"El ________ dejó a ambos equipos con posibilidades reales de clasificar."}],"paragraph_num":170,"paragraph_words":["ranking","puntuación","victoria","derrota","empate"],"paragraph_text":"Sobre el tablero de ajedrez, el jugador estudia la posición buscando una ventaja clara. Entre los elementos que aparecen en esta escena están ________, ________ y ________, de la mano de ________ y ________, allí, y esa jugada termina cambiando el rumbo del torneo."},{"group":171,"words":[{"word":"Tablas","meaning":"empate en ajedrez","sentence":"La partida terminó en ________ después de que ambos jugadores repitieran posición."},{"word":"Abandono","meaning":"renuncia a continuar una partida","sentence":"El jugador prefirió el ________ antes que continuar una posición ya perdida."},{"word":"Reloj","meaning":"instrumento que mide el tiempo","sentence":"El ________ marcaba pocos segundos cuando se ejecutó el movimiento decisivo."},{"word":"Tiempo","meaning":"duración de algo","sentence":"Administrar bien el ________ evita cometer errores por apuro en los últimos movimientos."},{"word":"Faraón","meaning":"gobernante del antiguo Egipto","sentence":"El ________ gobernaba con una autoridad que se consideraba de origen divino."}],"paragraph_num":171,"paragraph_words":["tablas","abandono","reloj","tiempo","faraón"],"paragraph_text":"Durante el torneo de ajedrez, la concentración marca la diferencia entre ganar y perder. Entre los elementos que resaltan en esta escena están ________, ________ y ________, junto con ________ y ________, también, esto confirma por qué el ajedrez exige tanta preparación mental."},{"group":172,"words":[{"word":"Emperador","meaning":"máximo gobernante de un imperio","sentence":"El ________ extendió sus dominios mediante alianzas y también mediante la guerra."},{"word":"Reina","meaning":"soberana de un reino","sentence":"La ________ asumió el poder tras la muerte inesperada de su predecesor."},{"word":"Príncipe","meaning":"hijo de un rey, futuro heredero","sentence":"El ________ fue educado desde niño para asumir el mando del reino."},{"word":"Noble","meaning":"persona de linaje privilegiado","sentence":"Cada ________ poseía tierras y súbditos bajo la autoridad directa del rey."},{"word":"Caballero","meaning":"guerrero de la nobleza medieval","sentence":"El ________ juró lealtad y defendió con honor los valores de su orden."}],"paragraph_num":172,"paragraph_words":["emperador","reina","príncipe","noble","caballero"],"paragraph_text":"Cada época de la historia dejó su propia visión sobre la vida y la muerte. Entre los elementos que se mencionan en esta escena están ________, ________ y ________, además de ________ y ________, más bien, y de esa manera la tradición se transmitió de generación en generación."},{"group":173,"words":[{"word":"Sacerdote","meaning":"ministro religioso","sentence":"El ________ guiaba los rituales que marcaban cada etapa importante de la comunidad."},{"word":"Monje","meaning":"religioso que vive en com _____ se entiende, en muchas doctrinas, como liberarse del sufrimiento definitivamente."}],"paragraph_num":176,"paragraph_words":["creación","génesis","apocalipsis","juicio","salvación"],"paragraph_text":"La historia de la humanidad está marcada por preguntas sobre el sentido de la existencia. Entre los elementos que resuenan en esta escena están ________, ________ y ________, junto con ________ y ________, a pesar de que, y con eso una civilización dejó su huella para siempre."},{"group":177,"words":[{"word":"Pecado","meaning":"falta moral o religiosa","sentence":"El ________ se define como aquello que aleja a la persona de sus propios valores."},{"word":"Perdón","meaning":"disculpa concedida por una ofensa","sentence":"El ________, aunque difícil, suele liberar más a quien lo otorga que a quien lo recibe."},{"word":"Libro","meaning":"obra escrita encuadernada","sentence":"Cada ________ sagrado transmite enseñanzas que una comunidad entera intenta seguir."},{"word":"Texto","meaning":"conjunto de palabras escritas","sentence":"El ________ original se interpretó de distintas formas a lo largo de los siglos."},{"word":"Página","meaning":"cada hoja de un documento","sentence":"Cada ________ del manuscrito antiguo se conservó con extremo cuidado."}],"paragraph_num":177,"paragraph_words":["pecado","perdón","libro","texto","página"],"paragraph_text":"Entre la filosofía y la religión, muchas civilizaciones buscaron respuestas a las grandes preguntas. Entre los elementos que destacan en esta escena están ________, ________ y ________, además de ________ y ________, en caso de que, esto sigue despertando grandes preguntas hasta hoy."},{"group":178,"words":[{"word":"Capítulo","meaning":"sección de un libro","sentence":"El ________ final resume las conclusiones de toda la investigación anterior."},{"word":"Párrafo","meaning":"conjunto de oraciones relacionadas","sentence":"Un solo ________ bien escrito puede transmitir una idea completa con claridad."},{"word":"Oración","meani <script>
(function(){
  const DATA = JSON.parse(document.getElementById('data-json').textContent);
  const IMG_B64 = document.getElementById('motiv-image').textContent.trim();
  const IMG_SRC = 'data:image/jpeg;base64,' + IMG_B64;

  const NOTEBOOK_NUM = 2;
  const GROUP_OFFSET = 90; // global group number of the first group in this notebook, minus 1
  const GLOBAL_TOTAL = 360;
  const TOTAL_GROUPS = DATA.length;
  const MOTIV_EVERY = 15; // show a motivational break every N completed groups

  const CAPTIONS = [
    'Nadie ve el esfuerzo. Todos ven el resultado.',
    'Lo que hoy cuesta, mañana es fuerza.',
    'Cada palabra estudiada es una repetición más.',
    'El progreso no se nota hasta que ya no se puede ignorar.',
    'La constancia de hoy es la ventaja de mañana.',
    'No pares. Cada grupo completado es una repetición ganada.'
  ];

  const app = document.getElementById('app');

  // ---- Build flat step list ----
  const steps = [];
  DATA.forEach((g, gi) => {
    g.words.forEach((w, wi) => {
      steps.push({ type:'meaning', gi, wi });
      steps.push({ type:'fill', gi, wi });
      steps.push({ type:'own', gi, wi });
    });
    steps.push({ type:'paragraph', gi });
    if ((gi + 1) % MOTIV_EVERY === 0 && (gi + 1) !== TOTAL_GROUPS){
      steps.push({ type:'motiv', gi });
    }
  });
  const TOTAL_STEPS = steps.length;

  // ---- State ----
  let state = { stepIndex: 0, answers: {}, screen: 'loading' };
  let saveTimer = null;
  function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(persist, 400); }

  const STORAGE_KEY = 'vocab-progress-cuaderno-' + NOTEBOOK_NUM;

  let saveErrorLogged = false;
  function persist(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        stepIndex: state.stepIndex, answers: state.answers
      }));
    }catch(e){
      if(!saveErrorLogged){ console.error('No se pudo guardar el progreso en este navegador', e); saveErrorLogged = true; }
    }
  }

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        state.stepIndex = Math.min(parsed.stepIndex || 0, TOTAL_STEPS - 1);
        state.answers = parsed.answers || {};
      }
    }catch(e){ /* no previous progress, or storage blocked (e.g. some file:// setups) */ }
    state.screen = 'home';
    render();
  }

  function keyFor(step, extra){
    if(step.type === 'paragraph') return `p-${step.gi}-${extra}`;
    return `${step.type}-${step.gi}-${step.wi}`;
  }

  function groupStatus(gi){
    const s = steps[state.stepIndex];
    const curGi = s ? s.gi : 0;
    if(gi < curGi) return 'done';
    if(gi === curGi) return 'current';
    return 'pending';
  }

  function firstStepIndexOfGroup(gi){ return steps.findIndex(s => s.gi === gi && s.type !== 'motiv'); }

  function goNext(){
    if(state.stepIndex < TOTAL_STEPS - 1){
      state.stepIndex++;
      scheduleSave();
      render();
      window.scrollTo(0,0);
    } else {
      state.screen = 'finished';
      scheduleSave();
      render();
    }
  }
  function goBack(){
    if(state.stepIndex > 0){ state.stepIndex--; render(); window.scrollTo(0,0); }
  }
  function jumpToGroup(gi){
    state.stepIndex = firstStepIndexOfGroup(gi);
    state.screen = 'exercise';
    render();
    window.scrollTo(0,0);
  }

  function el(tag, cls, html){
    const e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }

  function render(){
    app.innerHTML = '';
    if(state.screen === 'home') return renderHome();
    if(state.screen === 'overview') return renderOverview();
    if(state.screen === 'finished') return renderFinished();
    return renderExercise();
  }

  function renderBrand(){
    const brand = el('div','brand');
    brand.appendChild(el('h1', null, 'Cuaderno de Vocabulario'));
    const globalFirst = GROUP_OFFSET + 1, globalLast = GROUP_OFFSET + TOTAL_GROUPS;
    brand.appendChild(el('div','part', `Cuaderno ${NOTEBOOK_NUM} de 4 · Grupos ${globalFirst}–${globalLast}`));
    app.appendChild(brand);
  }

  function renderHome(){
    renderBrand();
    const wrap = el('div','home');

    const hero = el('div','motiv-hero');
    const img = document.createElement('img');
    img.src = IMG_SRC;
    img.alt = 'Estímulo motivacional';
    hero.appendChild(img);
    hero.appendChild(el('div','motiv-caption', CAPTIONS[NOTEBOOK_NUM % CAPTIONS.length]));
    wrap.appendChild(hero);

    const started = state.stepIndex > 0;
    wrap.appendChild(el('h1', null, started ? 'Seguimos.' : 'Empecemos.'));
    wrap.appendChild(el('p', null, 'Un ejercicio a la vez: significado, completar la oración y tu propia oración. Al terminar cinco palabras, completas el párrafo.'));

    const curStep = steps[state.stepIndex];
    const curGroupGlobal = GROUP_OFFSET + curStep.gi + 1;
    const stat = el('div','home-stat', `Vas por el <strong>grupo ${curGroupGlobal}</strong> (${curStep.gi+1} de ${TOTAL_GROUPS} en este cuaderno).`);
    wrap.appendChild(stat);

    const nav = el('div','nav-row');
    const startBtn = el('button','btn-primary', started ? 'Continuar' : 'Comenzar');
    startBtn.onclick = () => { state.screen = 'exercise'; render(); };
    nav.appendChild(startBtn);
    wrap.appendChild(nav);

    const overviewBtn = el('button','link-btn', 'Ver todos los grupos de este cuaderno');
    overviewBtn.onclick = () => { state.screen = 'overview'; render(); };
    wrap.appendChild(overviewBtn);

    app.appendChild(wrap);
  }

  function renderOverview(){
    renderBrand();
    const wrap = el('div', null);
    wrap.style.display='flex'; wrap.style.flexDirection='column'; wrap.style.flex='1';
    wrap.appendChild(el('div','field-label', 'Toca un grupo para ir directo a él'));
    const grid = el('div','overview-grid');
    for(let gi=0; gi<TOTAL_GROUPS; gi++){
      const status = groupStatus(gi);
      const dot = el('div', `g-dot ${status}`, String(GROUP_OFFSET + gi + 1));
      dot.onclick = () => jumpToGroup(gi);
      grid.appendChild(dot);
    }
    wrap.appendChild(grid);
    const back = el('button','btn-ghost', 'Volver');
    back.onclick = () => { state.screen = 'home'; render(); };
    wrap.appendChild(back);
    app.appendChild(wrap);
  }

  function renderFinished(){
    renderBrand();
    const wrap = el('div','done-screen');
    wrap.appendChild(el('h1', null, `¡Cuaderno ${NOTEBOOK_NUM} completo!`));
    const globalFirst = GROUP_OFFSET + 1, globalLast = GROUP_OFFSET + TOTAL_GROUPS;
    const isLastBook = globalLast === GLOBAL_TOTAL;
    wrap.appendChild(el('p', null, isLastBook
      ? `Terminaste los 360 grupos y sus 360 párrafos de los 4 cuadernos. Todo el vocabulario, completo.`
      : `Terminaste los grupos ${globalFirst} a ${globalLast}. Sigue con el Cuaderno ${NOTEBOOK_NUM + 1} cuando quieras.`));
    const nav = el('div','nav-row');
    const overviewBtn = el('button','btn-primary', 'Ver grupos');
    overviewBtn.onclick = () => { state.screen = 'overview'; render(); };
    nav.appendChild(overviewBtn);
    wrap.appendChild(nav);
    app.appendChild(wrap);
  }

  function progressBar(){
    const s = steps[state.stepIndex];
    const wrap = el('div','progress-wrap');
    const label = el('div','progress-label');
    const left = el('span', null, `Grupo ${GROUP_OFFSET + s.gi + 1} de ${GLOBAL_TOTAL}`);
    const right = el('span', null, `Paso ${state.stepIndex+1} de ${TOTAL_STEPS}`);
    label.appendChild(left); label.appendChild(right);
    const bar = el('div','progress-bar');
    const fill = el('div','progress-fill');
    fill.style.width = ((state.stepIndex+1)/TOTAL_STEPS*100).toFixed(2) + '%';
    bar.appendChild(fill);
    wrap.appendChild(label); wrap.appendChild(bar);
    return wrap;
  }

  function navRow(onNext, nextLabel){
    const row = el('div','nav-row');
    const back = el('button','btn-ghost', 'Atrás');
    back.disabled = state.stepIndex === 0;
    back.style.opacity = back.disabled ? '0.4' : '1';
    back.onclick = goBack;
    const next = el('button','btn-primary', nextLabel || 'Siguiente');
    next.onclick = onNext;
    row.appendChild(back); row.appendChild(next);
    return row;
  }

  function renderExercise(){
    const step = steps[state.stepIndex];

    if(step.type === 'motiv'){
      renderBrand();
      const wrap = el('div','motiv-screen');
      wrap.appendChild(el('div','motiv-kicker', `${GROUP_OFFSET + step.gi + 1} grupos completados`));
      const img = document.createElement('img');
      img.src = IMG_SRC;
      img.alt = 'Estímulo motivacional';
      wrap.appendChild(img);
      const capIdx = Math.floor((step.gi+1)/MOTIV_EVERY + NOTEBOOK_NUM) % CAPTIONS.length;
      wrap.appendChild(el('h2', null, CAPTIONS[capIdx]));
      wrap.appendChild(el('p', null, 'Respira, estira los dedos y sigue con el siguiente grupo.'));
      const nav = el('div','nav-row');
      nav.style.width = '100%';
      const next = el('button','btn-primary', 'Seguir estudiando');
      next.onclick = goNext;
      nav.appendChild(next);
      wrap.appendChild(nav);
      app.appendChild(wrap);
      return;
    }

    const group = DATA[step.gi];
    renderBrand();
    app.appendChild(progressBar());
    const card = el('div','card');

    if(step.type === 'meaning'){
      const w = group.words[step.wi];
      card.appendChild(el('div','step-kicker', `Grupo ${group.group} · Palabra ${step.wi+1} de 5 · Significado`));
      card.appendChild(el('div','word-title', w.word));
      card.appendChild(el('div','meaning-text', w.meaning));
      card.appendChild(el('div','spacer'));
      card.appendChild(navRow(goNext));
    }
    else if(step.type === 'fill'){
      const w = group.words[step.wi];
      card.appendChild(el('div','step-kicker', `Grupo ${group.group} · Palabra ${step.wi+1} de 5 · Completa la oración`));
      card.appendChild(el('div','word-title', w.word));
      const flow = el('div','sentence-flow');
      const key = keyFor(step);
      const parts = w.sentence.split('________');
      parts.forEach((part, i) => {
        flow.appendChild(document.createTextNode(part));
        if(i < parts.length - 1){
          const input = document.createElement('input');
          input.type = 'text'; input.className = 'blank-input'; input.placeholder = '…';
          input.value = state.answers[key] || '';
          input.autocomplete = 'off'; input.autocapitalize = 'off'; input.spellcheck = false;
          input.oninput = (e) => { state.answers[key] = e.target.value; scheduleSave(); };
          flow.appendChild(input);
        }
      });
      card.appendChild(flow);
      card.appendChild(el('div','spacer'));
      card.appendChild(navRow(goNext));
    }
    else if(step.type === 'own'){
      const w = group.words[step.wi];
      card.appendChild(el('div','step-kicker', `Grupo ${group.group} · Palabra ${step.wi+1} de 5 · Tu propia oración`));
      card.appendChild(el('div','word-title', w.word));
      card.appendChild(el('div','field-label', `Escribe una oración usando "${w.word.toLowerCase()}"`));
      const key = keyFor(step);
      const ta = document.createElement('textarea');
      ta.className = 'own-sentence';
      ta.value = state.answers[key] || '';
      ta.placeholder = 'Escribe aquí…';
      ta.oninput = (e) => { state.answers[key] = e.target.value; scheduleSave(); };
      card.appendChild(ta);
      card.appendChild(el('div','spacer'));
      card.appendChild(navRow(goNext));
    }
    else if(step.type === 'paragraph'){
      card.appendChild(el('div','step-kicker', `Grupo ${group.group} · Párrafo ${group.paragraph_num}`));
      card.appendChild(el('div','group-title', 'Completa el párrafo'));
      const flow = el('div','sentence-flow');
      const parts = group.paragraph_text.split('________');
      parts.forEach((part, i) => {
        flow.appendChild(document.createTextNode(part));
        if(i < parts.length - 1){
          const key = keyFor(step, i);
          const input = document.createElement('input');
          input.type = 'text'; input.className = 'blank-input'; input.placeholder = '…';
          input.value = state.answers[key] || '';
          input.autocomplete = 'off'; input.autocapitalize = 'off'; input.spellcheck = false;
          input.oninput = (e) => { state.answers[key] = e.target.value; scheduleSave(); };
          flow.appendChild(input);
        }
      });
      card.appendChild(flow);
      const bank = el('div','word-bank');
      group.paragraph_words.forEach(word => bank.appendChild(el('span','chip', word)));
      card.appendChild(bank);
      card.appendChild(el('div','spacer'));
      const isLastGroup = step.gi === TOTAL_GROUPS - 1;
      card.appendChild(navRow(goNext, isLastGroup ? 'Terminar cuaderno' : 'Siguiente grupo →'));
    }

    app.appendChild(card);
  }

  load();
})();

</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
</body>
</html>
